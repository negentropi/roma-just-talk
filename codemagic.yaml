workflows:
  cursor-avatar-runtime:
    name: Cursor avatar native runtime
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: "26.4.1"
    scripts:
      - name: Verify cursor feedback
        script: |
          set -euo pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/head.txt
          sw_vers > artifacts/environment.txt
          bash tools/cursor-avatar/verify.sh artifacts/native-feedback
          bash tools/cursor-avatar/verify-streaming.sh artifacts/streaming
      - name: Build the app for native inspection
        script: |
          set -euo pipefail
          make setup
          xcodebuild -project VoiceInk.xcodeproj -scheme VoiceInk -configuration Debug \
            -derivedDataPath /tmp/cursor-avatar-build -xcconfig LocalBuild.xcconfig \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM="" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) LOCAL_BUILD' \
            build > artifacts/build.log 2>&1
          ditto -c -k --keepParent /tmp/cursor-avatar-build/Build/Products/Debug/VoiceInk.app artifacts/candidate.zip
    artifacts:
      - artifacts/**
