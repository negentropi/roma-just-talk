name: Compare Mac writing settings UI

on:
  workflow_dispatch:
  push:
    branches:
      - "ci/rjt-writing-ui-check-*"

permissions:
  contents: read

concurrency:
  group: writing-ui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ui:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Keep the disposable desktop awake
        run: |
          /usr/bin/caffeinate -d -i -u -t 4500 </dev/null >/dev/null 2>&1 &
          echo "Temporary desktop assertion PID: $!"

      - name: Select Xcode and Metal toolchain
        shell: bash
        run: |
          set -o pipefail
          latest=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          test -n "$latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
          sw_vers
          swift --version
          command -v cmake >/dev/null || brew install cmake
          if ! xcrun metal --version >/dev/null 2>&1; then
            log="$RUNNER_TEMP/writing-ui-metal-download.log"
            xcodebuild -downloadComponent MetalToolchain 2>&1 | tee "$log"
            if ! xcrun metal --version >/dev/null 2>&1; then
              dmg=$(sed -n 's/^Downloaded asset to: //p' "$log" | tail -n 1)
              test -n "$dmg"
              hdiutil attach -readonly -nobrowse "$dmg"
            fi
          fi
          xcrun metal --version

      - name: Record the diagnostic source
        run: |
          proof="$RUNNER_TEMP/writing-ui-proof"
          mkdir -p "$proof"
          git rev-parse HEAD > "$proof/source-sha.txt"
          test "$(cat "$proof/source-sha.txt")" = "$GITHUB_SHA"
          shasum -a 256 \
            VoiceInkUITests/WritingFeaturesUITests.swift \
            VoiceInkTests/DictationHistoryUISeedLiveTests.swift \
            VoiceInk/VoiceInk.swift \
            VoiceInk/Models/Transcription.swift \
            VoiceInk/Models/WordReplacement.swift \
            VoiceInk/Models/VocabularyWord.swift \
            VoiceInk/Models/SessionMetric.swift \
            VoiceInkCore/Sources/VoiceInkCore/TranscriptionRecord.swift \
            VoiceInkCore/Sources/VoiceInkCore/WordReplacementLibrary.swift \
            VoiceInkCore/Sources/VoiceInkCore/DictionaryPolicy.swift \
            VoiceInk/Services/HistoryCorrectionApprovalService.swift \
            VoiceInk/Services/DictionaryService.swift \
            VoiceInk/Views/ModelSettingsView.swift \
            VoiceInk/Views/History/SaveCorrectionSheet.swift \
            VoiceInk/Views/History/HistoryProcessingViews.swift \
            VoiceInk/Views/History/InlineHistoryView.swift \
            VoiceInk/Views/History/TranscriptionDetailView.swift \
            VoiceInk/Views/Dictionary/WordReplacementView.swift \
            VoiceInk/Views/Dictionary/EditReplacementSheet.swift \
            VoiceInk/Views/Dictionary/WordReplacementReviewViews.swift \
            scripts/run-writing-settings-ui-regression.sh \
            scripts/run-writing-feature-regression.sh \
            .github/workflows/voiceink-writing-ui-check.yml \
            VoiceInk.xcodeproj/project.pbxproj \
            VoiceInk.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved \
            > "$proof/source-inputs.sha256"

      - name: Verify the regression verdict classifier
        run: |
          set -o pipefail
          bash scripts/run-writing-settings-ui-regression.sh --self-test | tee "$RUNNER_TEMP/writing-ui-proof/classifier-self-test.log"

      - uses: actions/cache/restore@v4
        id: deps-cache
        with:
          path: |
            ~/VoiceInk-Dependencies/whisper.cpp
            ~/Library/Caches/org.swift.swiftpm
          key: writing-macos-${{ runner.arch }}-${{ hashFiles('Makefile', 'scripts/verify-static-whisper-xcframework.sh', 'VoiceInk.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Verify the canonical package graph
        run: bash scripts/run-writing-feature-regression.sh packages "$RUNNER_TEMP/writing-package-proof"

      - name: Prepare and verify static Whisper dependencies
        run: |
          set -o pipefail
          make setup 2>&1 | tee "$RUNNER_TEMP/writing-ui-dependency-setup.log"

      - name: Preserve verified dependencies for test retries
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/VoiceInk-Dependencies/whisper.cpp
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Compare the disabled-panel baseline and eight current writing UI cases
        run: |
          defaults write com.negentropi.RomaJustTalk CurrentTranscriptionModel -string whisper-large-v3-turbo
          defaults write com.negentropi.RomaJustTalk PrewarmModelOnWake -bool false
          shasum -a 256 -c "$RUNNER_TEMP/writing-ui-proof/source-inputs.sha256"
          bash scripts/run-writing-settings-ui-regression.sh

      - name: Record the UI diagnostic outcome
        if: always()
        run: |
          proof="$RUNNER_TEMP/writing-ui-proof"
          mkdir -p "$proof"
          python3 - "$proof" <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          proof = Path(sys.argv[1])
          output = Path('.local-build/onboarding-test-evidence/writing-ui')
          result = output / 'result.json'
          comparison = Path(os.environ['RUNNER_TEMP']) / 'writing-settings-ui-regression' / 'result.json'
          payload = {
              'source_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'github_run_id': os.environ['GITHUB_RUN_ID'],
              'scope': 'Debug writing settings UI diagnostics only',
              'release_validation': False,
              'driver_result': json.loads(result.read_text()) if result.exists() else None,
              'comparison_result': json.loads(comparison.read_text()) if comparison.exists() else None,
          }
          (proof / 'diagnostic-result.json').write_text(json.dumps(payload, indent=2) + '\n')
          PY
          if [[ -f "$proof/source-inputs.sha256" ]]; then
            shasum -a 256 -c "$proof/source-inputs.sha256" > "$proof/source-inputs-after.txt"
          fi
          app=".local-build/Build/Products/Debug/roma just talk.app"
          if [[ -d "$app" ]]; then
            codesign --verify --deep --strict "$app"
            codesign -d --verbose=4 "$app" 2> "$proof/app-signature.txt"
          fi

      - name: Upload UI diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roma.writing-ui-diagnostic-evidence
          path: |
            .local-build/onboarding-test-evidence/writing-ui/**
            ${{ runner.temp }}/writing-ui-proof/**
            ${{ runner.temp }}/writing-ui-proof/history-seed/**
            ${{ runner.temp }}/writing-package-proof/**
            ${{ runner.temp }}/writing-settings-ui-regression/**
            ${{ runner.temp }}/writing-ui-dependency-setup.log
            ${{ runner.temp }}/writing-ui-metal-download.log
          include-hidden-files: true
          if-no-files-found: warn
