name: Verify writing delivery and failed import ownership

on:
  workflow_dispatch:
    inputs:
      lane:
        description: Immutable old baseline or completed candidate
        type: choice
        options:
          - baseline
          - candidate
        default: baseline
        required: true
  push:
    branches:
      - "ci/rjt-writing-delivery-commit-*"

permissions:
  contents: read

concurrency:
  group: writing-delivery-commit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      RJT_DELIVERY_COMMIT_LANE: ${{ inputs.lane || (startsWith(github.ref_name, 'ci/rjt-writing-delivery-commit-candidate-') && 'candidate' || 'baseline') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode and static dependency toolchain
        run: |
          /usr/bin/caffeinate -d -i -u -t 5400 </dev/null >/dev/null 2>&1 &
          latest=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          test -n "$latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
          swift --version
          sw_vers
          command -v cmake >/dev/null || brew install cmake
          if ! xcrun metal --version >/dev/null 2>&1; then
            log="$RUNNER_TEMP/writing-delivery-commit-metal-download.log"
            xcodebuild -downloadComponent MetalToolchain 2>&1 | tee "$log"
            if ! xcrun metal --version >/dev/null 2>&1; then
              dmg=$(sed -n 's/^Downloaded asset to: //p' "$log" | tail -n 1)
              test -n "$dmg"
              hdiutil attach -readonly -nobrowse "$dmg"
            fi
          fi
          xcrun metal --version

      - uses: actions/cache/restore@v4
        id: deps-cache
        with:
          path: |
            ~/VoiceInk-Dependencies/whisper.cpp
            ~/Library/Caches/org.swift.swiftpm
          key: writing-macos-${{ runner.arch }}-${{ hashFiles('Makefile', 'scripts/verify-static-whisper-xcframework.sh', 'VoiceInk.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Check exact three-case classification and baseline bridge
        run: |
          bash scripts/tests/verify-adhoc-macos-test-host.test.sh
          bash scripts/run-writing-delivery-commit-regression.sh self-test

      - name: Freeze old receivers, explicit test instrumentation and common oracle
        id: prepare
        run: bash scripts/run-writing-delivery-commit-regression.sh prepare

      - name: Verify static Whisper dependencies
        id: dependencies
        run: |
          set -o pipefail
          make setup 2>&1 | tee "$RUNNER_TEMP/writing-delivery-commit-dependencies.log"

      - uses: actions/cache/save@v4
        if: steps.deps-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/VoiceInk-Dependencies/whisper.cpp
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Execute the selected old or candidate native lane
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.dependencies.outcome == 'success' }}
        run: bash scripts/run-writing-delivery-commit-regression.sh run

      - name: Verify the immutable three-case lane result
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.dependencies.outcome == 'success' }}
        run: bash scripts/run-writing-delivery-commit-regression.sh verify

      - name: Upload source contracts and native result receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roma.writing-delivery-commit-observations
          path: |
            ${{ runner.temp }}/writing-delivery-commit-proof/*.json
            ${{ runner.temp }}/writing-delivery-commit-proof/source/**
            ${{ runner.temp }}/writing-delivery-commit-proof/packages/*.json
            ${{ runner.temp }}/writing-delivery-commit-proof/packages/*.resolved
            ${{ runner.temp }}/writing-delivery-commit-proof/baseline/*.json
            ${{ runner.temp }}/writing-delivery-commit-proof/baseline/*.txt
            ${{ runner.temp }}/writing-delivery-commit-proof/baseline/test-host-signature/**
            ${{ runner.temp }}/writing-delivery-commit-proof/baseline/tests.log
            ${{ runner.temp }}/writing-delivery-commit-proof/baseline/discovery/**
            ${{ runner.temp }}/writing-delivery-commit-proof/baseline/selection/**
            ${{ runner.temp }}/writing-delivery-commit-proof/candidate/*.json
            ${{ runner.temp }}/writing-delivery-commit-proof/candidate/*.txt
            ${{ runner.temp }}/writing-delivery-commit-proof/candidate/test-host-signature/**
            ${{ runner.temp }}/writing-delivery-commit-proof/candidate/tests.log
            ${{ runner.temp }}/writing-delivery-commit-proof/candidate/discovery/**
            ${{ runner.temp }}/writing-delivery-commit-proof/candidate/selection/**
          if-no-files-found: error

      - name: Upload exact build, launch configuration and native results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roma.writing-delivery-commit-native-evidence
          path: |
            ${{ runner.temp }}/writing-delivery-commit-proof/*.log
            ${{ runner.temp }}/writing-delivery-commit-proof/packages/*.log
            ${{ runner.temp }}/writing-delivery-commit-proof/baseline/*.log
            ${{ runner.temp }}/writing-delivery-commit-proof/baseline/*.xctestrun
            ${{ runner.temp }}/writing-delivery-commit-proof/baseline/*.csreq
            ${{ runner.temp }}/writing-delivery-commit-proof/baseline/Native.xcresult/**
            ${{ runner.temp }}/writing-delivery-commit-proof/candidate/*.log
            ${{ runner.temp }}/writing-delivery-commit-proof/candidate/*.xctestrun
            ${{ runner.temp }}/writing-delivery-commit-proof/candidate/*.csreq
            ${{ runner.temp }}/writing-delivery-commit-proof/candidate/Native.xcresult/**
            ${{ runner.temp }}/writing-delivery-commit-dependencies.log
          include-hidden-files: true
          if-no-files-found: error
