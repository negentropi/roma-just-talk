name: Check owned clipboard restoration

on:
  workflow_dispatch:
    inputs:
      lane:
        description: Baseline reproduces known-bad clipboard ownership; candidate requires changed paster
        required: true
        default: baseline
        type: choice
        options:
          - baseline
          - candidate
  push:
    branches:
      - "ci/rjt-clipboard-lease-check-*"

permissions:
  contents: read

concurrency:
  group: clipboard-lease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    runs-on: macos-26
    timeout-minutes: 75
    env:
      RJT_CLIPBOARD_LEASE_LANE: ${{ inputs.lane || (startsWith(github.ref, 'refs/heads/ci/rjt-clipboard-lease-check-candidate-') && 'candidate') || 'baseline' }}
    steps:
      - uses: actions/checkout@v4

      - name: Keep disposable desktop and select native toolchain
        run: |
          /usr/bin/caffeinate -d -i -u -t 4500 </dev/null >/dev/null 2>&1 &
          latest=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          test -n "$latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
          swift --version
          sw_vers
          command -v cmake >/dev/null || brew install cmake
          if ! xcrun metal --version >/dev/null 2>&1; then
            log="$RUNNER_TEMP/clipboard-lease-metal-download.log"
            xcodebuild -downloadComponent MetalToolchain 2>&1 | tee "$log"
            if ! xcrun metal --version >/dev/null 2>&1; then
              dmg=$(sed -n 's/^Downloaded asset to: //p' "$log" | tail -n 1)
              test -n "$dmg"
              hdiutil attach -readonly -nobrowse "$dmg"
            fi
          fi
          xcrun metal --version

      - name: Verify strict verdict classifier
        run: bash scripts/run-clipboard-lease-regression.sh self-test

      - uses: actions/cache/restore@v4
        id: deps-cache
        with:
          path: |
            ~/VoiceInk-Dependencies/whisper.cpp
            ~/Library/Caches/org.swift.swiftpm
          key: writing-macos-${{ runner.arch }}-${{ hashFiles('Makefile', 'scripts/verify-static-whisper-xcframework.sh', 'VoiceInk.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Bind exact source, known-bad ownership and canonical dependencies
        run: bash scripts/run-clipboard-lease-regression.sh prepare

      - name: Prepare and verify static Whisper
        run: |
          set -o pipefail
          make setup 2>&1 | tee "$RUNNER_TEMP/clipboard-lease-dependencies.log"

      - uses: actions/cache/save@v4
        if: steps.deps-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/VoiceInk-Dependencies/whisper.cpp
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Build exact app and native clipboard oracle once
        run: bash scripts/run-clipboard-lease-regression.sh build

      - name: Execute five selected clipboard observations
        run: bash scripts/run-clipboard-lease-regression.sh run

      - name: Require three intended old failures or five candidate passes
        run: bash scripts/run-clipboard-lease-regression.sh verify

      - name: Upload source, identity, observations and strict verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roma.clipboard-lease-observations
          path: |
            ${{ runner.temp }}/clipboard-lease-proof/*.json
            ${{ runner.temp }}/clipboard-lease-proof/*.txt
            ${{ runner.temp }}/clipboard-lease-proof/source/**
            ${{ runner.temp }}/clipboard-lease-proof/observations/**
            ${{ runner.temp }}/clipboard-lease-proof/selection/**
            ${{ runner.temp }}/clipboard-lease-proof/packages/*.json
            ${{ runner.temp }}/clipboard-lease-proof/packages/*.resolved
          if-no-files-found: error

      - name: Upload native logs and exact launch configuration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roma.clipboard-lease-native-evidence
          path: |
            ${{ runner.temp }}/clipboard-lease-proof/*.log
            ${{ runner.temp }}/clipboard-lease-proof/*.xctestrun
            ${{ runner.temp }}/clipboard-lease-proof/*.csreq
            ${{ runner.temp }}/clipboard-lease-proof/packages/*.log
            ${{ runner.temp }}/clipboard-lease-proof/Native.xcresult/**
            ${{ runner.temp }}/clipboard-lease-dependencies.log
            ${{ runner.temp }}/clipboard-lease-metal-download.log
          include-hidden-files: true
          if-no-files-found: error
