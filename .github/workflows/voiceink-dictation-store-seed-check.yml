name: Verify predecessor persistent store seed control

on:
  workflow_dispatch:
  push:
    branches:
      - "ci/rjt-dictation-store-seed-check-*"

permissions:
  contents: read

concurrency:
  group: dictation-store-seed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  store-control:
    runs-on: macos-26
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 26 and Metal toolchain
        run: |
          /usr/bin/caffeinate -d -i -u -t 6000 </dev/null >/dev/null 2>&1 &
          latest=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          test -n "$latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
          swift --version
          sw_vers
          command -v cmake >/dev/null || brew install cmake
          if ! xcrun metal --version >/dev/null 2>&1; then
            log="$RUNNER_TEMP/dictation-store-metal-download.log"
            xcodebuild -downloadComponent MetalToolchain 2>&1 | tee "$log"
            if ! xcrun metal --version >/dev/null 2>&1; then
              dmg=$(sed -n 's/^Downloaded asset to: //p' "$log" | tail -n 1)
              test -n "$dmg"
              hdiutil attach -readonly -nobrowse "$dmg"
            fi
          fi
          xcrun metal --version

      - name: Check strict driver classifiers and closed-copy controls
        run: bash scripts/run-dictation-store-seed-check.sh self-test

      - name: Pin real products and seed disposable startup defaults
        id: prepare
        run: bash scripts/run-dictation-store-seed-check.sh prepare

      - uses: actions/cache/restore@v4
        id: deps-cache
        with:
          path: |
            ~/VoiceInk-Dependencies/whisper.cpp
            ~/Library/Caches/org.swift.swiftpm
          key: writing-macos-${{ runner.arch }}-${{ hashFiles('Makefile', 'scripts/verify-static-whisper-xcframework.sh', 'VoiceInk.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Build and freeze one shared static Whisper dependency
        id: dependencies
        run: bash scripts/run-dictation-store-seed-check.sh dependencies

      - uses: actions/cache/save@v4
        if: steps.deps-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/VoiceInk-Dependencies/whisper.cpp
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Seed and reopen in separate actual predecessor hosts
        id: predecessor
        run: bash scripts/run-dictation-store-seed-check.sh predecessor

      - name: Preserve predecessor checkpoint before current app build
        id: old-checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: roma.dictation-store-predecessor-seed
          path: |
            ${{ runner.temp }}/dictation-store-seed-proof/contract.json
            ${{ runner.temp }}/dictation-store-seed-proof/common-oracle.swift
            ${{ runner.temp }}/dictation-store-seed-proof/canonical.Package.resolved
            ${{ runner.temp }}/dictation-store-seed-proof/*source.json
            ${{ runner.temp }}/dictation-store-seed-proof/factory-*.swift
            ${{ runner.temp }}/dictation-store-seed-proof/dependencies-frozen.json
            ${{ runner.temp }}/dictation-store-seed-proof/packages-frozen.json
            ${{ runner.temp }}/dictation-store-seed-proof/disposable-user.json
            ${{ runner.temp }}/dictation-store-seed-proof/toolchain.json
            ${{ runner.temp }}/dictation-store-seed-proof/*-setup.json
            ${{ runner.temp }}/dictation-store-seed-proof/setup-source-*.json
            ${{ runner.temp }}/dictation-store-seed-proof/startup-defaults.json
            ${{ runner.temp }}/dictation-store-seed-proof/seed-closed-tree.json
            ${{ runner.temp }}/dictation-store-seed-proof/seed-readonly.json
            ${{ runner.temp }}/dictation-store-seed-proof/old-reopen-clone-before.json
            ${{ runner.temp }}/dictation-store-seed-proof/predecessor-checkpoint.json
            ${{ runner.temp }}/dictation-store-seed-proof/seed/**
            ${{ runner.temp }}/dictation-store-seed-proof/old-reopen/**
            ${{ runner.temp }}/dictation-store-seed-proof/stores/seed/**
            ${{ runner.temp }}/dictation-store-seed-proof/stores/old-reopen/**
            ${{ runner.temp }}/dictation-store-seed-proof/predecessor-build/**
          include-hidden-files: true
          if-no-files-found: error

      - name: Read a new closed-seed clone in the unchanged-schema current host
        if: ${{ steps.old-checkpoint.outcome == 'success' }}
        run: bash scripts/run-dictation-store-seed-check.sh candidate

      - name: Require exact runtime identity and all old values across hosts
        run: bash scripts/run-dictation-store-seed-check.sh verify

      - name: Retain complete native results and closed fixture receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roma.dictation-store-seed-control
          path: |
            ${{ runner.temp }}/dictation-store-seed-proof/**
            ${{ runner.temp }}/dictation-store-metal-download.log
          include-hidden-files: true
          if-no-files-found: error
