name: Verify native Light and Clarity dictation

on:
  workflow_dispatch:
  push:
    branches:
      - "ci/rjt-dictation-polish-native-*"

permissions:
  contents: read

concurrency:
  group: dictation-polish-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode and the static dependency toolchain
        run: |
          /usr/bin/caffeinate -d -i -u -t 5400 </dev/null >/dev/null 2>&1 &
          latest=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          test -n "$latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
          swift --version
          sw_vers
          command -v cmake >/dev/null || brew install cmake
          if ! xcrun metal --version >/dev/null 2>&1; then
            log="$RUNNER_TEMP/dictation-polish-native-metal-download.log"
            xcodebuild -downloadComponent MetalToolchain 2>&1 | tee "$log"
            if ! xcrun metal --version >/dev/null 2>&1; then
              dmg=$(sed -n 's/^Downloaded asset to: //p' "$log" | tail -n 1)
              test -n "$dmg"
              hdiutil attach -readonly -nobrowse "$dmg"
            fi
          fi
          xcrun metal --version

      - uses: actions/cache/restore@v4
        id: deps-cache
        with:
          path: |
            ~/VoiceInk-Dependencies/whisper.cpp
            ~/Library/Caches/org.swift.swiftpm
          key: writing-macos-${{ runner.arch }}-${{ hashFiles('Makefile', 'scripts/verify-static-whisper-xcframework.sh', 'VoiceInk.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Check exact selection and observation classifiers
        run: bash scripts/run-dictation-polish-native-check.sh self-test

      - name: Bind candidate source, native oracles and canonical packages
        id: prepare
        run: bash scripts/run-dictation-polish-native-check.sh prepare

      - name: Prepare and verify static Whisper
        id: dependencies
        run: |
          set -o pipefail
          make setup 2>&1 | tee "$RUNNER_TEMP/dictation-polish-native-dependencies.log"

      - uses: actions/cache/save@v4
        if: steps.deps-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/VoiceInk-Dependencies/whisper.cpp
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Execute four real Whisper file operations and native TextEdit delivery
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.dependencies.outcome == 'success' }}
        run: bash scripts/run-dictation-polish-native-check.sh native

      - name: Recheck frozen source, signed app and native observations
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.dependencies.outcome == 'success' }}
        run: bash scripts/run-dictation-polish-native-check.sh verify

      - name: Upload compact native acceptance observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roma.dictation-polish-native-observations
          path: |
            ${{ runner.temp }}/dictation-polish-native-proof/*.json
            ${{ runner.temp }}/dictation-polish-native-proof/*.txt
            ${{ runner.temp }}/dictation-polish-native-proof/source/**
            ${{ runner.temp }}/dictation-polish-native-proof/observations/**
            ${{ runner.temp }}/dictation-polish-native-proof/editor-observations/**
            ${{ runner.temp }}/dictation-polish-native-proof/test-host-signature/**
            ${{ runner.temp }}/dictation-polish-native-proof/discovery/**
            ${{ runner.temp }}/dictation-polish-native-proof/selection/**
            ${{ runner.temp }}/dictation-polish-native-proof/packages/*.json
            ${{ runner.temp }}/dictation-polish-native-proof/packages/*.resolved
            ${{ runner.temp }}/dictation-polish-native-proof/inputs/input.wav
            ${{ runner.temp }}/dictation-polish-native-proof/tests.log
          if-no-files-found: error

      - name: Upload build logs and exact native configuration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roma.dictation-polish-native-evidence
          path: |
            ${{ runner.temp }}/dictation-polish-native-proof/*.log
            ${{ runner.temp }}/dictation-polish-native-proof/*.xctestrun
            ${{ runner.temp }}/dictation-polish-native-proof/*.csreq
            ${{ runner.temp }}/dictation-polish-native-proof/packages/*.log
            ${{ runner.temp }}/dictation-polish-native-proof/Native.xcresult/**
            ${{ runner.temp }}/dictation-polish-native-dependencies.log
            ${{ runner.temp }}/dictation-polish-native-metal-download.log
          include-hidden-files: true
          if-no-files-found: error
