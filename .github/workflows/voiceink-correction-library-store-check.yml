name: Verify correction library persistent store upgrade

on:
  workflow_dispatch:
  push:
    branches:
      - "ci/rjt-correction-library-store-check-*"

permissions:
  contents: read

concurrency:
  group: correction-library-store-${{ github.ref }}
  cancel-in-progress: false

jobs:
  correction-library-store:
    runs-on: macos-26
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 26 and Metal toolchain
        run: |
          /usr/bin/caffeinate -d -i -u -t 6000 </dev/null >/dev/null 2>&1 &
          latest=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          test -n "$latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
          swift --version
          sw_vers
          command -v cmake >/dev/null || brew install cmake
          if ! xcrun metal --version >/dev/null 2>&1; then
            log="$RUNNER_TEMP/correction-library-store-metal-download.log"
            xcodebuild -downloadComponent MetalToolchain 2>&1 | tee "$log"
            if ! xcrun metal --version >/dev/null 2>&1; then
              dmg=$(sed -n 's/^Downloaded asset to: //p' "$log" | tail -n 1)
              test -n "$dmg"
              hdiutil attach -readonly -nobrowse "$dmg"
            fi
          fi
          xcrun metal --version

      - name: Check schema delta and exact hosted-test classifiers
        run: bash scripts/run-correction-library-store-check.sh self-test

      - name: Pin real products and seed disposable startup defaults
        id: prepare
        run: bash scripts/run-correction-library-store-check.sh prepare

      - uses: actions/cache/restore@v4
        id: deps-cache
        with:
          path: |
            ~/VoiceInk-Dependencies/whisper.cpp
            ~/Library/Caches/org.swift.swiftpm
          key: writing-macos-${{ runner.arch }}-${{ hashFiles('Makefile', 'scripts/verify-static-whisper-xcframework.sh', 'VoiceInk.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Build and freeze one shared static Whisper dependency
        id: dependencies
        run: bash scripts/run-correction-library-store-check.sh dependencies

      - uses: actions/cache/save@v4
        if: steps.deps-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/VoiceInk-Dependencies/whisper.cpp
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Seed and reopen in separate actual predecessor hosts
        id: predecessor
        run: bash scripts/run-correction-library-store-check.sh predecessor

      - name: Preserve predecessor checkpoint before current app build
        id: old-checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: roma.correction-library-predecessor-seed
          path: ${{ runner.temp }}/correction-library-store-proof/**
          include-hidden-files: true
          if-no-files-found: error

      - name: Upgrade, save correction records, and reopen the same closed clone
        if: ${{ steps.old-checkpoint.outcome == 'success' }}
        run: bash scripts/run-correction-library-store-check.sh candidate

      - name: Require exact schema delta, stored values, and host identities
        run: bash scripts/run-correction-library-store-check.sh verify

      - name: Retain complete native results and closed fixture receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roma.correction-library-store-check
          path: |
            ${{ runner.temp }}/correction-library-store-proof/**
            ${{ runner.temp }}/correction-library-store-metal-download.log
          include-hidden-files: true
          if-no-files-found: error
