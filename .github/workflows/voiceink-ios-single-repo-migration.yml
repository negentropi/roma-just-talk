name: VoiceInk iOS single-repo migration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/voiceink-ios-single-repo-migration.yml"
      - "scripts/**"
      - "docs/**"
      - "VoiceInkCore/**"
      - "iOS/**"
      - "VoiceInk/**"
      - "VoiceInk.xcodeproj/**"
      - "VoiceInk.xcworkspace/**"
  push:
    branches:
      - main
      - "ci/**" # Temporary CI transport branches during the migration.
    paths:
      - ".github/workflows/voiceink-ios-single-repo-migration.yml"
      - "scripts/**"
      - "docs/**"
      - "VoiceInkCore/**"
      - "iOS/**"
      - "VoiceInk/**"
      - "VoiceInk.xcodeproj/**"
      - "VoiceInk.xcworkspace/**"

permissions:
  contents: read

jobs:
  verify:
    name: Verify single-repo migration
    runs-on: namespace-profile-roma-jt
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Run config verifier
        run: bash scripts/verify-ios-single-repo-migration.sh

      - name: Run VoiceInkCore checks
        run: swift run --package-path VoiceInkCore VoiceInkCoreChecks

      - name: Prepare local Whisper framework
        run: make setup

      - name: Build macOS app
        run: make local CONFIGURATION=Release

      - name: Build iOS app
        run: |
          xcodebuild build \
            -workspace VoiceInk.xcworkspace \
            -scheme VoiceInk-ios \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$PWD/.local-build-ios" \
            CODE_SIGNING_ALLOWED=NO

      - name: Run focused iOS parity tests
        run: |
          SIMULATOR_UDID="$(
            xcrun simctl list devices available --json \
              | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid'
          )"
          test -n "$SIMULATOR_UDID"
          test "$SIMULATOR_UDID" != "null"
          xcodebuild test \
            -workspace VoiceInk.xcworkspace \
            -scheme VoiceInk-ios \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$PWD/.local-build-ios" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            EXCLUDED_SOURCE_FILE_NAMES=VoiceInk_iosTests.swift \
            -only-testing:VoiceInk-iosTests/KeyboardDictationExchangeTests \
            -only-testing:VoiceInk-iosTests/KeyboardReadinessTests \
            -only-testing:VoiceInk-iosTests/IOSTranscriptionTaskCoordinatorTests \
            -only-testing:VoiceInk-iosTests/IOSStreamingTranscriptionTests \
            -only-testing:VoiceInk-iosTests/IOSLocalWhisperSettingsTests \
            -only-testing:VoiceInk-iosTests/IOSLocalWhisperModelImporterTests \
            -only-testing:VoiceInk-iosTests/IOSMicrophonePermissionTests \
            -only-testing:VoiceInk-iosTests/IOSNativeAppleTranscriptionTests \
            -only-testing:VoiceInk-iosTests/IOSRecordingAppIntentTests \
            -only-testing:VoiceInk-iosTests/IOSAnnouncementsStoreTests
