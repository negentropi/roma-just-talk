name: Compare onboarding accessibility action acknowledgement

on:
  workflow_dispatch:
  push:
    branches:
      - "ci/rjt-onboarding-ax-action-check-*"

permissions:
  contents: read

concurrency:
  group: onboarding-ax-action-${{ github.ref }}
  cancel-in-progress: false

jobs:
  comparison:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode and Metal toolchain
        run: |
          set -o pipefail
          /usr/bin/caffeinate -d -i -u -t 4500 </dev/null >/dev/null 2>&1 &
          latest=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          test -n "$latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
          swift --version
          sw_vers
          command -v cmake >/dev/null || brew install cmake
          if ! xcrun metal --version >/dev/null 2>&1; then
            log="$RUNNER_TEMP/onboarding-ax-action-metal-download.log"
            xcodebuild -downloadComponent MetalToolchain 2>&1 | tee "$log"
            if ! xcrun metal --version >/dev/null 2>&1; then
              dmg=$(sed -n 's/^Downloaded asset to: //p' "$log" | tail -n 1)
              test -n "$dmg"
              hdiutil attach -readonly -nobrowse "$dmg"
            fi
          fi
          xcrun metal --version

      - name: Check the strict acknowledgement classifier
        run: bash scripts/run-onboarding-ax-action-regression.sh --self-test

      - uses: actions/cache/restore@v4
        id: deps-cache
        with:
          path: |
            ~/VoiceInk-Dependencies/whisper.cpp
            ~/Library/Caches/org.swift.swiftpm
          key: writing-macos-${{ runner.arch }}-${{ hashFiles('Makefile', 'scripts/verify-static-whisper-xcframework.sh', 'VoiceInk.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Verify the unchanged canonical package graph
        run: bash scripts/run-writing-feature-regression.sh packages "$RUNNER_TEMP/onboarding-ax-action-packages"

      - name: Prepare and verify static Whisper dependencies
        run: |
          set -o pipefail
          make setup 2>&1 | tee "$RUNNER_TEMP/onboarding-ax-action-dependencies.log"

      - uses: actions/cache/save@v4
        if: steps.deps-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/VoiceInk-Dependencies/whisper.cpp
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Compare old and new helpers with one compiled native action test
        run: |
          defaults write com.negentropi.RomaJustTalk CurrentTranscriptionModel -string whisper-large-v3-turbo
          defaults write com.negentropi.RomaJustTalk PrewarmModelOnWake -bool false
          bash scripts/run-onboarding-ax-action-regression.sh

      - name: Upload matched acknowledgement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roma.onboarding-ax-action-evidence
          path: |
            ${{ runner.temp }}/onboarding-ax-action-regression/**
            ${{ runner.temp }}/onboarding-ax-action-packages/**
            ${{ runner.temp }}/onboarding-ax-action-dependencies.log
            ${{ runner.temp }}/onboarding-ax-action-metal-download.log
          include-hidden-files: true
          if-no-files-found: warn
