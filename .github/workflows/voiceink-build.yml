name: Build roma just talk

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/voiceink-build.yml"
      - "LocalBuild.xcconfig"
      - "Makefile"
      - "Tools/**"
      - "VoiceInk/**"
      - "VoiceInkTests/**"
      - "VoiceInk.xcodeproj/**"

jobs:
  build:
    name: Build release macOS app
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Compile visible text latency harness helper
        run: make latency-harness-app

      - name: Verify latency helper run target
        run: make latency-harness-check

      - name: Build release app
        run: make local CONFIGURATION=Release

      - name: Run Debug unit tests
        timeout-minutes: 15
        run: |
          xcodebuild test \
            -project VoiceInk.xcodeproj \
            -scheme VoiceInk \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$PWD/.local-build" \
            -xcconfig LocalBuild.xcconfig \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_ENTITLEMENTS="$PWD/VoiceInk/VoiceInk.local.entitlements" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) LOCAL_BUILD' \
            -only-testing:VoiceInkTests

      - name: Reject debug-only release payload
        run: |
          APP="$HOME/Applications/roma just talk.app"
          if [ -e "$APP/Contents/MacOS/roma just talk.debug.dylib" ] || [ -e "$APP/Contents/MacOS/__preview.dylib" ]; then
            echo "Release artifact contains debug-only binaries:"
            ls -la "$APP/Contents/MacOS"
            exit 1
          fi

      - name: Package app
        run: ditto -c -k --keepParent "$HOME/Applications/roma just talk.app" "roma.just.talk.app.zip"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: roma.just.talk.app
          path: roma.just.talk.app.zip
          if-no-files-found: error
