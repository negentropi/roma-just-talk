name: Prepare remote E2E stage

on:
  workflow_dispatch:
    inputs:
      target:
        description: Desktop surfaces to prepare
        required: true
        default: both
        type: choice
        options:
          - both
          - macos
          - ios
      macos_artifact_run_id:
        description: Build run ID containing the app; blank finds a green build for this tooling SHA
        required: false
        type: string
      runtime_helper_run_id:
        description: Build run ID containing helper from this tooling SHA; blank finds its green build
        required: false
        type: string
      macos_runner:
        description: Runner label for the requested macOS image
        required: true
        default: namespace-profile-roma-jt
        type: string
      macos_expected_version:
        description: Exact macOS version; required for distribution, optional otherwise
        required: false
        type: string
      macos_expected_build:
        description: Exact macOS build; required for distribution, optional otherwise
        required: false
        type: string
      developer_dir:
        description: Optional Xcode developer directory for the selected runner
        required: false
        type: string
      macos_scenario:
        description: macOS scenario; distribution follows browser, Finder, Gatekeeper, and runtime smoke
        required: true
        default: none
        type: choice
        options:
          - none
          - runtime-smoke
          - runtime-e2e
          - distribution-e2e
      macos_audio_artifact:
        description: Private Namespace WAV artifact; required for full runtime, optional for smoke
        required: false
        type: string
      macos_repetitions:
        description: Repetitions per fixture and app after the functional smoke
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "3"
          - "5"
      ios_artifact_run_id:
        description: Migration run ID containing the iOS Simulator app; blank uses latest green run
        required: false
        type: string
      ios_scenario:
        description: Optional deterministic iOS interaction scenario
        required: true
        default: none
        type: choice
        options:
          - none
          - local-whisper-import
      hold_minutes:
        description: Time available after setup/scenario; 0 uploads evidence immediately
        required: true
        default: "30"
        type: choice
        options:
          - "0"
          - "15"
          - "30"
          - "45"
          - "60"
  push:
    branches:
      - "ci/remote-e2e-stage-*"
    paths:
      - ".github/workflows/voiceink-remote-e2e-stage.yml"
      - "scripts/open-remote-e2e-stage.sh"
      - "scripts/prepare-remote-e2e-stage.sh"
      - "scripts/run-macos-runtime-e2e.sh"
      - "scripts/run-macos-distribution-e2e.sh"
      - "scripts/macos-bundle-manifest.sh"
      - "scripts/verify-macos-distribution-launch.sh"
      - "scripts/tests/macos-distribution-e2e-contract.test.sh"
      - "scripts/tests/verify-macos-distribution-launch.test.sh"
      - "scripts/runtime-e2e-model-bootstrap.sh"
      - "scripts/runtime-e2e-phase-runner.sh"
      - "scripts/runtime-e2e-parakeet-v2.manifest"
      - "scripts/run-ios-remote-stt-e2e.sh"
      - "Tools/RuntimeE2EHarness/**"
      - "Makefile"
      - "scripts/check-runtime-e2e-makefile.sh"
      - "docs/RUNTIME_E2E_HARNESS.md"
      - "docs/remote-e2e-stage.md"

permissions:
  actions: read
  contents: read

env:
  STAGE_TARGET: ${{ inputs.target || 'ios' }}
  STAGE_HOLD_MINUTES: ${{ inputs.hold_minutes || '10' }}
  STAGE_MACOS_SCENARIO: ${{ inputs.macos_scenario || 'none' }}
  STAGE_MACOS_AUDIO_ARTIFACT: ${{ inputs.macos_audio_artifact || '' }}
  STAGE_MACOS_REPETITIONS: ${{ inputs.macos_repetitions || '3' }}
  STAGE_MACOS_EXPECTED_VERSION: ${{ inputs.macos_expected_version || '' }}
  STAGE_MACOS_EXPECTED_BUILD: ${{ inputs.macos_expected_build || '' }}
  STAGE_DEVELOPER_DIR: ${{ inputs.developer_dir || '' }}
  STAGE_IOS_SCENARIO: ${{ inputs.ios_scenario || 'none' }}

concurrency:
  group: namespace-profile-roma-jt
  cancel-in-progress: false
  queue: max

jobs:
  stage:
    name: Remote desktop ready
    runs-on: ${{ inputs.macos_runner || 'namespace-profile-roma-jt' }}
    timeout-minutes: 105
    outputs:
      scenario-outcome: ${{ steps.prepare-stage.outcome }}

    steps:
      - name: Checkout stage tooling
        uses: actions/checkout@v4

      - name: Require a fresh Namespace macOS runner instance
        env:
          REQUESTED_RUNNER: ${{ inputs.macos_runner || 'namespace-profile-roma-jt' }}
        run: |
          case "$REQUESTED_RUNNER" in
            namespace-profile-*|nscloud-macos-*) ;;
            *)
              echo "macos_runner must select a Namespace macOS runner" >&2
              exit 2
              ;;
          esac
          case "$RUNNER_NAME" in
            nsc-runner-*) ;;
            *)
              echo "Namespace runner name must expose its instance ID" >&2
              exit 2
              ;;
          esac
          BOOT_EPOCH="$(
            sysctl -n kern.boottime \
              | sed -E 's/^\{ sec = ([0-9]+),.*/\1/'
          )"
          BOOT_SESSION_UUID="$(sysctl -n kern.bootsessionuuid)"
          [[ "$BOOT_EPOCH" =~ ^[0-9]+$ ]]
          [[ "$BOOT_SESSION_UUID" =~ ^[0-9A-Fa-f-]{36}$ ]]
          BOOT_AGE_SECONDS="$(( $(date +%s) - BOOT_EPOCH ))"
          [ "$BOOT_AGE_SECONDS" -ge 0 ]
          echo "STAGE_RUNNER_LABEL=$REQUESTED_RUNNER" >> "$GITHUB_ENV"
          echo "STAGE_RUNNER_NAME=$RUNNER_NAME" >> "$GITHUB_ENV"
          echo "STAGE_RUNNER_INSTANCE_ID=${RUNNER_NAME#nsc-runner-}" >> "$GITHUB_ENV"
          echo "STAGE_RUNNER_BOOT_EPOCH=$BOOT_EPOCH" >> "$GITHUB_ENV"
          echo "STAGE_RUNNER_BOOT_SESSION_UUID=$BOOT_SESSION_UUID" >> "$GITHUB_ENV"
          echo "STAGE_RUNNER_BOOT_AGE_SECONDS=$BOOT_AGE_SECONDS" >> "$GITHUB_ENV"

      - name: Select requested Xcode
        if: env.STAGE_DEVELOPER_DIR != ''
        run: |
          if [[ ! "$STAGE_DEVELOPER_DIR" =~ ^/Applications/Xcode[^/]*\.app/Contents/Developer$ ]]; then
            echo "developer_dir must name an Xcode app under /Applications" >&2
            exit 2
          fi
          test -d "$STAGE_DEVELOPER_DIR"
          echo "DEVELOPER_DIR=$STAGE_DEVELOPER_DIR" >> "$GITHUB_ENV"

      - name: Show toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Initialize stage evidence
        if: always()
        run: |
          EVIDENCE="$RUNNER_TEMP/voiceink-remote-e2e-stage/evidence"
          mkdir -p "$EVIDENCE"
          {
            printf 'stage_runner_label=%s\n' "$STAGE_RUNNER_LABEL"
            printf 'stage_runner_name=%s\n' "$STAGE_RUNNER_NAME"
            printf 'stage_runner_instance_id=%s\n' "$STAGE_RUNNER_INSTANCE_ID"
            printf 'stage_runner_boot_epoch=%s\n' "$STAGE_RUNNER_BOOT_EPOCH"
            printf 'stage_runner_boot_session_uuid=%s\n' "$STAGE_RUNNER_BOOT_SESSION_UUID"
            printf 'stage_runner_boot_age_seconds_at_job_start=%s\n' "$STAGE_RUNNER_BOOT_AGE_SECONDS"
            printf 'expected_macos_version=%s\n' "$STAGE_MACOS_EXPECTED_VERSION"
            printf 'expected_macos_build=%s\n' "$STAGE_MACOS_EXPECTED_BUILD"
          } > "$EVIDENCE/provisioning-context.txt"

      - name: Verify distribution E2E tooling
        run: |
          bash scripts/tests/macos-distribution-e2e-contract.test.sh
          bash scripts/tests/verify-macos-distribution-launch.test.sh

      - name: Download macOS app artifact
        if: env.STAGE_TARGET != 'ios'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ inputs.macos_artifact_run_id }}
          REQUESTED_HELPER_RUN_ID: ${{ inputs.runtime_helper_run_id }}
        run: |
          mkdir -p \
            "$RUNNER_TEMP/remote-e2e-inputs/macos/distributed" \
            "$RUNNER_TEMP/remote-e2e-inputs/macos/unwrapped" \
            "$RUNNER_TEMP/remote-e2e-inputs/macos/runtime-helper"

          validate_build_run() {
            local run_id="$1"
            local output="$2"
            local required_head_sha="${3:-}"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
              | jq -e \
                --arg repository "$GITHUB_REPOSITORY" \
                --arg required_head_sha "$required_head_sha" '
                  select(
                    .repository.full_name == $repository
                    and .head_repository.full_name == $repository
                    and .status == "completed"
                    and .conclusion == "success"
                    and (.event == "push" or .event == "workflow_dispatch")
                    and ((.path | split("@")[0]) == ".github/workflows/voiceink-build.yml")
                    and ($required_head_sha == "" or .head_sha == $required_head_sha)
                  )
                  | {
                      runId: .id,
                      headSha: .head_sha,
                      workflowId: .workflow_id,
                      workflowName: .name,
                      workflowPath: (.path | split("@")[0]),
                      headBranch: .head_branch,
                      headRepository: .head_repository.full_name,
                      event: .event,
                      status: .status,
                      conclusion: .conclusion,
                      htmlUrl: .html_url,
                      repository: .repository.full_name
                    }
                ' > "$output"
            test -s "$output"
          }

          record_required_namespace_job() {
            local run_id="$1"
            local job_name="$2"
            local output="$3"
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" \
              | jq -e \
                --argjson run_id "$run_id" \
                --arg job_name "$job_name" '
                  [
                    .jobs[]
                    | select(
                        .name == $job_name
                        and .status == "completed"
                        and .conclusion == "success"
                        and (.runner_name | startswith("nsc-runner-"))
                      )
                    | {
                        jobId: .id,
                        name: .name,
                        runnerName: .runner_name,
                        status: .status,
                        conclusion: .conclusion,
                        startedAt: .started_at,
                        completedAt: .completed_at
                      }
                  ]
                  | select(length == 1)
                  | {runId: $run_id, job: .[0]}
                ' > "$output"
            test -s "$output"
          }

          RUN_ID="$REQUESTED_RUN_ID"
          APP_REQUIRED_HEAD_SHA=""
          if [ -z "$RUN_ID" ]; then
            if [ "$STAGE_MACOS_SCENARIO" = distribution-e2e ]; then
              while IFS= read -r CANDIDATE_RUN_ID; do
                CANDIDATE_ARTIFACT_ID="$(
                  gh api \
                    "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/artifacts?per_page=100" \
                    --jq '[.artifacts[] | select(.name == "roma.just.talk.app" and .expired == false)][0].id // empty'
                )"
                if [ -z "$CANDIDATE_ARTIFACT_ID" ]; then
                  continue
                fi
                if record_required_namespace_job \
                  "$CANDIDATE_RUN_ID" \
                  "Build release macOS app" \
                  "$RUNNER_TEMP/remote-e2e-inputs/macos/macos-app-run-jobs.json"; then
                  RUN_ID="$CANDIDATE_RUN_ID"
                  break
                fi
              done < <(
                gh run list \
                  --repo "$GITHUB_REPOSITORY" \
                  --workflow voiceink-build.yml \
                  --status success \
                  --commit "$GITHUB_SHA" \
                  --limit 20 \
                  --json databaseId,event \
                  --jq '.[] | select(.event == "push" or .event == "workflow_dispatch") | .databaseId'
              )
            else
              RUN_ID="$(
                gh run list \
                  --repo "$GITHUB_REPOSITORY" \
                  --workflow voiceink-build.yml \
                  --status success \
                  --commit "$GITHUB_SHA" \
                  --limit 20 \
                  --json databaseId,event \
                  --jq '[.[] | select(.event == "push" or .event == "workflow_dispatch")] | first | .databaseId // empty'
              )"
            fi
            APP_REQUIRED_HEAD_SHA="$GITHUB_SHA"
          fi
          test -n "$RUN_ID"
          validate_build_run \
            "$RUN_ID" \
            "$RUNNER_TEMP/remote-e2e-inputs/macos/macos-app-run-metadata.json" \
            "$APP_REQUIRED_HEAD_SHA"
          if [ "$STAGE_MACOS_SCENARIO" = distribution-e2e ]; then
            record_required_namespace_job \
              "$RUN_ID" \
              "Build release macOS app" \
              "$RUNNER_TEMP/remote-e2e-inputs/macos/macos-app-run-jobs.json"
          fi
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name roma.just.talk.app \
            --dir "$RUNNER_TEMP/remote-e2e-inputs/macos/unwrapped"
          test -f "$RUNNER_TEMP/remote-e2e-inputs/macos/unwrapped/roma.just.talk.app.zip"
          if [ "$STAGE_MACOS_SCENARIO" != none ]; then
            HELPER_RUN_ID="$REQUESTED_HELPER_RUN_ID"
            if [ -z "$HELPER_RUN_ID" ]; then
              while IFS= read -r CANDIDATE_RUN_ID; do
                HELPER_ARTIFACT_ID="$(
                  gh api \
                    "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/artifacts?per_page=100" \
                    --jq '[.artifacts[] | select(.name == "roma.runtime-e2e-harness.macos" and .expired == false)][0].id // empty'
                )"
                if [ -n "$HELPER_ARTIFACT_ID" ]; then
                  HELPER_RUN_ID="$CANDIDATE_RUN_ID"
                  break
                fi
              done < <(
                gh run list \
                  --repo "$GITHUB_REPOSITORY" \
                  --workflow voiceink-build.yml \
                  --status success \
                  --commit "$GITHUB_SHA" \
                  --limit 20 \
                  --json databaseId,event \
                  --jq '.[] | select(.event == "push" or .event == "workflow_dispatch") | .databaseId'
              )
            fi
            test -n "$HELPER_RUN_ID"
            validate_build_run \
              "$HELPER_RUN_ID" \
              "$RUNNER_TEMP/remote-e2e-inputs/macos/runtime-helper-run-metadata.json" \
              "$GITHUB_SHA"
            if [ "$STAGE_MACOS_SCENARIO" = distribution-e2e ]; then
              record_required_namespace_job \
                "$HELPER_RUN_ID" \
                "Build reusable runtime E2E helper" \
                "$RUNNER_TEMP/remote-e2e-inputs/macos/runtime-helper-run-jobs.json"
            fi
            gh run download "$HELPER_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name roma.runtime-e2e-harness.macos \
              --dir "$RUNNER_TEMP/remote-e2e-inputs/macos/runtime-helper"
            test -f "$RUNNER_TEMP/remote-e2e-inputs/macos/runtime-helper/roma.runtime-e2e-harness.macos.zip"
            echo "$HELPER_RUN_ID" \
              > "$RUNNER_TEMP/remote-e2e-inputs/macos/runtime-helper-run-id.txt"
            echo "Using runtime helper from run $HELPER_RUN_ID at $(jq -r .headSha "$RUNNER_TEMP/remote-e2e-inputs/macos/runtime-helper-run-metadata.json")"
          fi

          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" \
            | jq -e \
              --argjson run_id "$RUN_ID" '
                [.artifacts[] | select(.name == "roma.just.talk.app" and .expired == false)]
                | select(length == 1)
                | .[0]
                | {
                    id,
                    runId: $run_id,
                    name,
                    sizeInBytes: .size_in_bytes,
                    digest,
                    createdAt: .created_at,
                    expiresAt: .expires_at,
                    expired
                  }
                | select(.digest | test("^sha256:[0-9a-f]{64}$"))
              ' \
              > "$RUNNER_TEMP/remote-e2e-inputs/macos/macos-artifact-metadata.json"
          ARTIFACT_ID="$(
            jq -r .id "$RUNNER_TEMP/remote-e2e-inputs/macos/macos-artifact-metadata.json"
          )"
          test -n "$ARTIFACT_ID"
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > "$RUNNER_TEMP/remote-e2e-inputs/macos/distributed/roma.just.talk.app.zip"
          test -s "$RUNNER_TEMP/remote-e2e-inputs/macos/distributed/roma.just.talk.app.zip"
          DISTRIBUTED_ARCHIVE_SHA="$(
            shasum -a 256 \
              "$RUNNER_TEMP/remote-e2e-inputs/macos/distributed/roma.just.talk.app.zip" \
              | awk '{print $1}'
          )"
          test "sha256:$DISTRIBUTED_ARCHIVE_SHA" = "$(
            jq -r .digest "$RUNNER_TEMP/remote-e2e-inputs/macos/macos-artifact-metadata.json"
          )"

          EXPECTED_INNER_SHA="$(
            shasum -a 256 "$RUNNER_TEMP/remote-e2e-inputs/macos/unwrapped/roma.just.talk.app.zip" \
              | awk '{print $1}'
          )"
          DISTRIBUTED_INNER_SHA="$(
            unzip -p \
              "$RUNNER_TEMP/remote-e2e-inputs/macos/distributed/roma.just.talk.app.zip" \
              roma.just.talk.app.zip \
              | shasum -a 256 \
              | awk '{print $1}'
          )"
          test "$DISTRIBUTED_INNER_SHA" = "$EXPECTED_INNER_SHA"
          echo "$RUN_ID" > "$RUNNER_TEMP/remote-e2e-inputs/macos/build-run-id.txt"
          echo "$ARTIFACT_ID" > "$RUNNER_TEMP/remote-e2e-inputs/macos/macos-artifact-id.txt"
          echo "$GITHUB_REPOSITORY" \
            > "$RUNNER_TEMP/remote-e2e-inputs/macos/macos-artifact-repository.txt"
          echo "Using macOS artifact from run $RUN_ID at $(jq -r .headSha "$RUNNER_TEMP/remote-e2e-inputs/macos/macos-app-run-metadata.json")"

      - name: Download iOS Simulator app artifact
        if: env.STAGE_TARGET != 'macos'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ inputs.ios_artifact_run_id }}
        run: |
          RUN_ID="$REQUESTED_RUN_ID"
          if [ -z "$RUN_ID" ]; then
            RUN_ID="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow voiceink-ios-single-repo-migration.yml \
                --status success \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId'
            )"
          fi
          test -n "$RUN_ID"
          mkdir -p "$RUNNER_TEMP/remote-e2e-inputs/ios"
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name roma.just.talk.ios-simulator.app \
            --dir "$RUNNER_TEMP/remote-e2e-inputs/ios"
          test -f "$RUNNER_TEMP/remote-e2e-inputs/ios/roma.just.talk.ios-simulator.app.zip"
          echo "$RUN_ID" > "$RUNNER_TEMP/remote-e2e-inputs/ios/build-run-id.txt"
          echo "Using iOS artifact from run $RUN_ID"

      - name: Mount runtime E2E model cache
        id: runtime-model-cache
        if: >-
          env.STAGE_TARGET != 'ios' &&
          env.STAGE_MACOS_SCENARIO != 'none' &&
          startsWith(inputs.macos_runner, 'namespace-profile-')
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          path: ~/Library/Caches/roma-runtime-e2e-models

      - name: Initialize cold runtime E2E model cache
        if: >-
          env.STAGE_TARGET != 'ios' &&
          env.STAGE_MACOS_SCENARIO != 'none' &&
          startsWith(inputs.macos_runner, 'nscloud-macos-')
        run: |
          COLD_CACHE="$RUNNER_TEMP/roma-runtime-e2e-cold-model-cache"
          if [ -e "$COLD_CACHE" ] || [ -L "$COLD_CACHE" ]; then
            {
              printf 'cold_model_cache_preexisting=true\n'
              printf 'cold_model_cache_path=%s\n' "$COLD_CACHE"
            } >> "$RUNNER_TEMP/voiceink-remote-e2e-stage/evidence/provisioning-context.txt"
            ls -ldeO@ "$COLD_CACHE" \
              > "$RUNNER_TEMP/voiceink-remote-e2e-stage/evidence/cold-model-cache-preexisting.txt"
            exit 2
          fi
          test ! -e "$COLD_CACHE"
          test ! -L "$COLD_CACHE"
          mkdir -p "$COLD_CACHE"
          {
            printf 'cold_model_cache_preexisting=false\n'
            printf 'cold_model_cache_path=%s\n' "$COLD_CACHE"
          } >> "$RUNNER_TEMP/voiceink-remote-e2e-stage/evidence/provisioning-context.txt"
          echo "RUNTIME_E2E_MODEL_CACHE_PATH=$COLD_CACHE" >> "$GITHUB_ENV"

      - name: Prepare desktop and hold for Remote Display
        id: prepare-stage
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_MODEL_CACHE_HIT: ${{ steps.runtime-model-cache.outputs.cache-hit }}
        run: |
          bash scripts/prepare-remote-e2e-stage.sh \
            "$STAGE_TARGET" \
            "$STAGE_HOLD_MINUTES" \
            "$RUNNER_TEMP/remote-e2e-inputs" \
            "$RUNNER_TEMP/voiceink-remote-e2e-stage" \
            "$STAGE_IOS_SCENARIO" \
            "$STAGE_MACOS_SCENARIO" \
            "$STAGE_MACOS_AUDIO_ARTIFACT" \
            "$STAGE_MACOS_REPETITIONS" \
            "$STAGE_MACOS_EXPECTED_VERSION" \
            "$STAGE_MACOS_EXPECTED_BUILD" \
            "$RUNNER_TEMP/remote-e2e-inputs/macos/runtime-helper/roma.runtime-e2e-harness.macos.zip"

      - name: Upload stage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-e2e-stage-evidence
          path: ${{ runner.temp }}/voiceink-remote-e2e-stage/evidence
          if-no-files-found: error
          retention-days: 7

  verdict:
    name: Require scenario success
    if: always()
    needs: stage
    runs-on: ubuntu-latest
    steps:
      - name: Check remote stage result
        env:
          STAGE_RESULT: ${{ needs.stage.result }}
          SCENARIO_OUTCOME: ${{ needs.stage.outputs.scenario-outcome }}
        run: |
          test "$STAGE_RESULT" = success
          test "$SCENARIO_OUTCOME" = success
