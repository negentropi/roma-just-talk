name: Verify lip dictation app on macOS

on:
  push:
    branches:
      - "ci/lip-dictation-app-*"

permissions:
  contents: read

concurrency:
  group: lip-dictation-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode and toolchain
        run: |
          /usr/bin/caffeinate -d -i -u -t 7200 </dev/null >/dev/null 2>&1 &
          latest=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$latest"
          xcodebuild -version
          sw_vers
          command -v cmake >/dev/null || brew install cmake
          if ! xcrun metal --version >/dev/null 2>&1; then
            log="$RUNNER_TEMP/metal.log"
            xcodebuild -downloadComponent MetalToolchain 2>&1 | tee "$log"
            if ! xcrun metal --version >/dev/null 2>&1; then
              dmg=$(sed -n 's/^Downloaded asset to: //p' "$log" | tail -n 1)
              hdiutil attach -readonly -nobrowse "$dmg"
            fi
          fi
          xcrun metal --version

      - name: Compile and load the actual runtime proof helper
        run: python3 Tools/LipDictationE2E/run.py --build-helper-only --out "$RUNNER_TEMP/lip-helper-preflight"

      - uses: actions/cache/restore@v4
        id: deps
        with:
          path: |
            ~/VoiceInk-Dependencies/whisper.cpp
            ~/Library/Caches/org.swift.swiftpm
          key: writing-macos-${{ runner.arch }}-${{ hashFiles('Makefile', 'scripts/verify-static-whisper-xcframework.sh', 'VoiceInk.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: writing-macos-${{ runner.arch }}-

      - name: Prepare static Whisper
        run: make setup

      - uses: actions/cache/save@v4
        if: steps.deps.outputs.cache-hit != 'true'
        with:
          path: |
            ~/VoiceInk-Dependencies/whisper.cpp
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Install BlackHole input
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install --cask blackhole-2ch
          sudo killall coreaudiod || true
          sleep 4
          system_profiler SPAudioDataType | grep "BlackHole 2ch"

      - name: Prove text-only Power Mode isolation and all shared core checks
        run: python3 scripts/verify-lip-power-mode.py

      - name: Build release app
        id: release
        run: make local CONFIGURATION=Release

      - name: Debug unit tests
        id: unit
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        timeout-minutes: 25
        env:
          RJT_REQUIRE_MICROPHONE_PRIVACY_PROOF: "1"
          TEST_RUNNER_RJT_REQUIRE_MICROPHONE_PRIVACY_PROOF: "1"
        run: bash scripts/run-macos-ci-unit-tests.sh

      - name: Prove microphone, paste, auto-send, and prewarm regressions
        if: ${{ !cancelled() && steps.unit.outcome == 'success' }}
        timeout-minutes: 35
        run: python3 scripts/verify-lip-pipeline-cancellation.py

      - name: Verify real voice and lip dictation through the app shortcut
        if: ${{ !cancelled() && steps.unit.outcome == 'success' }}
        timeout-minutes: 35
        env:
          LIP_CAMERA_PROBE_USE_HOST_AUTOLOGIN_AUTH: "1"
        run: python3 Tools/LipDictationE2E/run.py --app "$HOME/Applications/roma just talk.app" --app-source-head "$GITHUB_SHA" --visual

      - name: Package app
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        run: ditto -c -k --keepParent "$HOME/Applications/roma just talk.app" roma.just.talk.app.zip

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        with:
          name: roma.just.talk.app
          path: roma.just.talk.app.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lip-dictation-app-evidence
          path: |
            .local-build/onboarding-test-evidence/**
            .local-build/lip-pipeline-regression/**
            .local-build/lip-power-mode-regression/**
            ${{ runner.temp }}/lip-helper-preflight/**
            ${{ runner.temp }}/lip-dictation-e2e/**
            ${{ runner.temp }}/lip-camera-probe/*.json
            ${{ runner.temp }}/lip-camera-probe/*.log
            ${{ runner.temp }}/lip-camera-probe/*.png
            VoiceInk.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if-no-files-found: ignore
