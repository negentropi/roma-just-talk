name: Verify shared Core checks

on:
  workflow_dispatch:
  push:
    branches:
      - "ci/rjt-core-check-*"

permissions:
  contents: read

concurrency:
  group: core-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Record source and existing package pins
        run: |
          evidence="$RUNNER_TEMP/voiceink-core-check"
          mkdir -p "$evidence/pins"
          git rev-parse HEAD | tee "$evidence/source-head.txt"
          test "$(cat "$evidence/source-head.txt")" = "$GITHUB_SHA"
          git ls-files -z -- VoiceInkCore VoiceInkNVIDIA \
            .github/workflows/voiceink-core-check.yml \
            VoiceInk.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved \
            | xargs -0 shasum -a 256 > "$evidence/source-before.sha256"
          cp VoiceInkCore/Package.resolved "$evidence/pins/Core.Package.resolved"
          cp VoiceInkNVIDIA/Package.resolved "$evidence/pins/NVIDIA.Package.resolved"
          cp VoiceInk.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved \
            "$evidence/pins/Xcode.Package.resolved"

      - name: Select installed Xcode 26
        run: |
          set -o pipefail
          latest=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          test -n "$latest"
          sudo xcode-select -s "$latest"
          {
            xcodebuild -version
            swift --version
            sw_vers
          } 2>&1 | tee "$RUNNER_TEMP/voiceink-core-check/toolchain.log"

      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: core-macos26-${{ runner.arch }}-${{ hashFiles('VoiceInkCore/Package.swift', 'VoiceInkCore/Package.resolved', 'VoiceInkNVIDIA/Package.swift', 'VoiceInkNVIDIA/Package.resolved') }}

      - name: Run every shared Core check with frozen versions
        run: |
          set -o pipefail
          result=0
          swift run --package-path VoiceInkCore --force-resolved-versions --skip-update \
            VoiceInkCoreChecks 2>&1 | tee "$RUNNER_TEMP/voiceink-core-check/core-checks.log" || result=$?
          printf '%s\n' "$result" > "$RUNNER_TEMP/voiceink-core-check/check-exit-code.txt"
          exit "$result"

      - name: Verify source and pins stayed unchanged
        if: always()
        run: |
          set -o pipefail
          evidence="$RUNNER_TEMP/voiceink-core-check"
          git rev-parse HEAD > "$evidence/source-after-head.txt"
          cmp "$evidence/source-head.txt" "$evidence/source-after-head.txt"
          shasum -a 256 -c "$evidence/source-before.sha256" \
            2>&1 | tee "$evidence/source-verification.log"
          git status --short > "$evidence/git-status.txt"
          git diff --exit-code -- VoiceInkCore VoiceInkNVIDIA \
            .github/workflows/voiceink-core-check.yml \
            VoiceInk.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Upload Core check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roma.core-check-evidence
          path: ${{ runner.temp }}/voiceink-core-check/**
          if-no-files-found: error
