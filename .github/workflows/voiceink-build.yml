name: Build roma just talk

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/voiceink-build.yml"
      - "LocalBuild.xcconfig"
      - "scripts/release/**"
      - "scripts/tests/**"
      - "Makefile"
      - "Tools/**"
      - "VoiceInk/**"
      - "VoiceInkTests/**"
      - "VoiceInk.xcodeproj/**"

jobs:
  build:
    name: Build release macOS app
    runs-on: namespace-profile-roma-jt
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Run release pipeline regression tests
        run: bash scripts/tests/release-pipeline.test.sh

      - name: Compile visible text latency harness helper
        run: make latency-harness-app

      - name: Verify latency helper run target
        run: make latency-harness-check

      - name: Compile and verify autonomous runtime E2E harness
        run: make runtime-e2e-check

      - name: Build release app
        run: make local CONFIGURATION=Release

      - name: Run Debug unit tests
        timeout-minutes: 15
        run: |
          xcodebuild test \
            -project VoiceInk.xcodeproj \
            -scheme VoiceInk \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$PWD/.local-build" \
            -xcconfig LocalBuild.xcconfig \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_ENTITLEMENTS="$PWD/VoiceInk/VoiceInk.local.entitlements" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) LOCAL_BUILD' \
            -only-testing:VoiceInkTests

      - name: Reject debug-only release payload
        run: |
          APP="$HOME/Applications/roma just talk.app"
          if [ -e "$APP/Contents/MacOS/roma just talk.debug.dylib" ] || [ -e "$APP/Contents/MacOS/__preview.dylib" ]; then
            echo "Release artifact contains debug-only binaries:"
            ls -la "$APP/Contents/MacOS"
            exit 1
          fi

      - name: Verify packaged app identity
        run: |
          APP="$HOME/Applications/roma just talk.app"
          BUNDLE_ID=$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")
          test "$BUNDLE_ID" = "com.negentropi.RomaJustTalk"

      - name: Package app
        run: ditto -c -k --keepParent "$HOME/Applications/roma just talk.app" "roma.just.talk.app.zip"

      # Structural and signature validation of the exact ZIP produced above.
      # This is a development (ad-hoc) build, so Developer ID, notarization and
      # the launch check are only enforced by .github/workflows/macos-release.yml.
      - name: Validate the packaged development artifact
        run: |
          bash scripts/release/validate-macos-artifact.sh \
            --artifact "roma.just.talk.app.zip" \
            --allow-adhoc \
            --skip-launch

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: roma.just.talk.app
          path: roma.just.talk.app.zip
          if-no-files-found: error
