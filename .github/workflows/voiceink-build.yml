name: Build VoiceInk

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/voiceink-build.yml"
      - "LocalBuild.xcconfig"
      - "Makefile"
      - "RomaCore/**"
      - "VoiceInk/**"
      - "VoiceInk.xcodeproj/**"

jobs:
  build:
    name: Build local macOS app
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Build local app
        run: make local

      - name: Test ElevenLabs API key errors
        run: |
          xcodebuild test -project VoiceInk.xcodeproj -scheme VoiceInk -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath .local-build \
            -xcconfig LocalBuild.xcconfig \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" CODE_SIGN_ENTITLEMENTS="$PWD/VoiceInk/VoiceInk.local.entitlements" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) LOCAL_BUILD' \
            -only-testing:VoiceInkTests/ElevenLabsAPIKeyErrorTests

      - name: Package app
        run: ditto -c -k --keepParent "$HOME/Applications/VoiceInk.app" VoiceInk.app.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceInk-app
          path: VoiceInk.app.zip
          if-no-files-found: error
