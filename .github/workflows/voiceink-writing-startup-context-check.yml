name: Verify recording-owned startup context

on:
  workflow_dispatch:
  push:
    branches:
      - "ci/rjt-writing-startup-context-check-*"

permissions:
  contents: read

concurrency:
  group: writing-startup-context-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode and static dependency toolchain
        run: |
          /usr/bin/caffeinate -d -i -u -t 5400 </dev/null >/dev/null 2>&1 &
          latest=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          test -n "$latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
          swift --version
          sw_vers
          command -v cmake >/dev/null || brew install cmake
          if ! xcrun metal --version >/dev/null 2>&1; then
            log="$RUNNER_TEMP/startup-context-metal-download.log"
            xcodebuild -downloadComponent MetalToolchain 2>&1 | tee "$log"
            if ! xcrun metal --version >/dev/null 2>&1; then
              dmg=$(sed -n 's/^Downloaded asset to: //p' "$log" | tail -n 1)
              test -n "$dmg"
              hdiutil attach -readonly -nobrowse "$dmg"
            fi
          fi
          xcrun metal --version

      - uses: actions/cache/restore@v4
        id: deps-cache
        with:
          path: |
            ~/VoiceInk-Dependencies/whisper.cpp
            ~/Library/Caches/org.swift.swiftpm
          key: writing-macos-${{ runner.arch }}-${{ hashFiles('Makefile', 'scripts/verify-static-whisper-xcframework.sh', 'VoiceInk.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Bind source and package comparison
        id: prepare
        run: bash scripts/run-writing-startup-context-regression.sh prepare

      - name: Verify static Whisper dependencies
        run: |
          set -o pipefail
          make setup 2>&1 | tee "$RUNNER_TEMP/startup-context-dependencies.log"

      - uses: actions/cache/save@v4
        if: steps.deps-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/VoiceInk-Dependencies/whisper.cpp
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Full candidate Mac units
        id: units
        run: bash scripts/run-writing-startup-context-regression.sh units

      - name: Candidate native startup ownership
        if: ${{ !cancelled() && steps.units.outcome == 'success' }}
        run: bash scripts/run-writing-startup-context-regression.sh candidate

      - name: Publish candidate observations promptly
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: roma.startup-context-candidate
          path: |
            ${{ runner.temp }}/writing-startup-context-proof/contract.json
            ${{ runner.temp }}/writing-startup-context-proof/failure-*.json
            ${{ runner.temp }}/writing-startup-context-proof/candidate/*.json
            ${{ runner.temp }}/writing-startup-context-proof/candidate/*.txt
            ${{ runner.temp }}/writing-startup-context-proof/candidate/tests.log
            ${{ runner.temp }}/writing-startup-context-proof/candidate/observations/**
            ${{ runner.temp }}/writing-startup-context-proof/candidate/selection/**
          if-no-files-found: error

      - name: Known-bad native startup ownership
        if: ${{ !cancelled() && steps.units.outcome == 'success' }}
        run: bash scripts/run-writing-startup-context-regression.sh baseline

      - name: Require matched native failure and success
        if: ${{ !cancelled() && steps.units.outcome == 'success' }}
        run: bash scripts/run-writing-startup-context-regression.sh verify

      - name: Upload source contracts and native observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roma.startup-context-observations
          path: |
            ${{ runner.temp }}/writing-startup-context-proof/*.json
            ${{ runner.temp }}/writing-startup-context-proof/*.swift
            ${{ runner.temp }}/writing-startup-context-proof/*/*.json
            ${{ runner.temp }}/writing-startup-context-proof/*/*.patch
            ${{ runner.temp }}/writing-startup-context-proof/*/*.txt
            ${{ runner.temp }}/writing-startup-context-proof/*/tests.log
            ${{ runner.temp }}/writing-startup-context-proof/*/observations/**
            ${{ runner.temp }}/writing-startup-context-proof/*/selection/**
            ${{ runner.temp }}/writing-startup-context-proof/packages/*.json
          if-no-files-found: error

      - name: Upload full candidate and baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roma.startup-context-evidence
          path: |
            ${{ runner.temp }}/writing-startup-context-proof/**
            .local-build/onboarding-test-evidence/**
            ${{ runner.temp }}/startup-context-dependencies.log
          include-hidden-files: true
          if-no-files-found: error
