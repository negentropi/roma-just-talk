name: Verify writing edits during Power Mode

on:
  workflow_dispatch:
  push:
    branches:
      - "ci/rjt-power-mode-check-*"

permissions:
  contents: read

concurrency:
  group: writing-power-mode-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep the disposable desktop awake
        run: |
          /usr/bin/caffeinate -d -i -u -t 5400 </dev/null >/dev/null 2>&1 &
          echo "Temporary desktop assertion PID: $!"

      - name: Select Xcode and Metal toolchain
        run: |
          latest=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          test -n "$latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
          sw_vers
          swift --version
          command -v cmake >/dev/null || brew install cmake
          if ! xcrun metal --version >/dev/null 2>&1; then
            log="$RUNNER_TEMP/power-mode-metal-download.log"
            xcodebuild -downloadComponent MetalToolchain 2>&1 | tee "$log"
            if ! xcrun metal --version >/dev/null 2>&1; then
              dmg=$(sed -n 's/^Downloaded asset to: //p' "$log" | tail -n 1)
              test -n "$dmg"
              hdiutil attach -readonly -nobrowse "$dmg"
            fi
          fi
          xcrun metal --version

      - uses: actions/cache/restore@v4
        id: deps-cache
        with:
          path: |
            ~/VoiceInk-Dependencies/whisper.cpp
            ~/Library/Caches/org.swift.swiftpm
          key: writing-macos-${{ runner.arch }}-${{ hashFiles('Makefile', 'scripts/verify-static-whisper-xcframework.sh', 'VoiceInk.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Verify static Whisper dependencies
        run: |
          set -o pipefail
          make setup 2>&1 | tee "$RUNNER_TEMP/power-mode-dependencies.log"

      - uses: actions/cache/save@v4
        if: steps.deps-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/VoiceInk-Dependencies/whisper.cpp
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Matched Power Mode UI regression
        run: bash scripts/run-writing-power-mode-regression.sh

      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roma.writing-power-mode-evidence
          path: |
            ${{ runner.temp }}/writing-power-mode-proof/**
            ${{ runner.temp }}/power-mode-dependencies.log
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload screenshots and observed state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roma.writing-power-mode-observations
          path: |
            ${{ runner.temp }}/writing-power-mode-proof/*/*/attachments/**
            ${{ runner.temp }}/writing-power-mode-proof/*/*/result.json
            ${{ runner.temp }}/writing-power-mode-proof/contract.json
            ${{ runner.temp }}/writing-power-mode-proof/result.json
          if-no-files-found: warn
