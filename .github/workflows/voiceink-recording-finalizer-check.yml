name: Verify recording finalizer ownership

on:
  workflow_dispatch:
  push:
    branches:
      - "ci/rjt-recording-finalizer-*"

permissions:
  contents: read

concurrency:
  group: recording-finalizer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode and static dependency toolchain
        run: |
          /usr/bin/caffeinate -d -i -u -t 5400 </dev/null >/dev/null 2>&1 &
          latest=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          test -n "$latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
          swift --version
          sw_vers
          command -v cmake >/dev/null || brew install cmake
          if ! xcrun metal --version >/dev/null 2>&1; then
            log="$RUNNER_TEMP/recording-finalizer-metal-download.log"
            xcodebuild -downloadComponent MetalToolchain 2>&1 | tee "$log"
            if ! xcrun metal --version >/dev/null 2>&1; then
              dmg=$(sed -n 's/^Downloaded asset to: //p' "$log" | tail -n 1)
              test -n "$dmg"
              hdiutil attach -readonly -nobrowse "$dmg"
            fi
          fi
          xcrun metal --version

      - uses: actions/cache/restore@v4
        id: deps-cache
        with:
          path: |
            ~/VoiceInk-Dependencies/whisper.cpp
            ~/Library/Caches/org.swift.swiftpm
          key: writing-macos-${{ runner.arch }}-${{ hashFiles('Makefile', 'scripts/verify-static-whisper-xcframework.sh', 'VoiceInk.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Check strict result classification and source fixture
        run: |
          bash scripts/tests/verify-adhoc-macos-test-host.test.sh
          bash scripts/run-recording-finalizer-regression.sh self-test

      - name: Bind exact Engine sources, common oracle and package graph
        id: prepare
        run: bash scripts/run-recording-finalizer-regression.sh prepare

      - name: Verify static Whisper dependencies
        id: dependencies
        run: |
          set -o pipefail
          make setup 2>&1 | tee "$RUNNER_TEMP/recording-finalizer-dependencies.log"

      - uses: actions/cache/save@v4
        if: steps.deps-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/VoiceInk-Dependencies/whisper.cpp
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Require exact known-bad context ownership failures
        id: baseline
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.dependencies.outcome == 'success' }}
        run: bash scripts/run-recording-finalizer-regression.sh baseline

      - name: Require both candidate native regressions to pass
        id: candidate
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.dependencies.outcome == 'success' }}
        run: bash scripts/run-recording-finalizer-regression.sh candidate

      - name: Require the matched native red and green result
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.dependencies.outcome == 'success' }}
        run: bash scripts/run-recording-finalizer-regression.sh verify

      - name: Upload source contracts and native result receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roma.recording-finalizer-observations
          path: |
            ${{ runner.temp }}/recording-finalizer-proof/*.json
            ${{ runner.temp }}/recording-finalizer-proof/source/**
            ${{ runner.temp }}/recording-finalizer-proof/packages/*.json
            ${{ runner.temp }}/recording-finalizer-proof/packages/*.resolved
            ${{ runner.temp }}/recording-finalizer-proof/baseline/*.json
            ${{ runner.temp }}/recording-finalizer-proof/baseline/*.txt
            ${{ runner.temp }}/recording-finalizer-proof/baseline/test-host-signature/**
            ${{ runner.temp }}/recording-finalizer-proof/baseline/tests.log
            ${{ runner.temp }}/recording-finalizer-proof/baseline/discovery/**
            ${{ runner.temp }}/recording-finalizer-proof/baseline/selection/**
            ${{ runner.temp }}/recording-finalizer-proof/candidate/*.json
            ${{ runner.temp }}/recording-finalizer-proof/candidate/*.txt
            ${{ runner.temp }}/recording-finalizer-proof/candidate/test-host-signature/**
            ${{ runner.temp }}/recording-finalizer-proof/candidate/tests.log
            ${{ runner.temp }}/recording-finalizer-proof/candidate/discovery/**
            ${{ runner.temp }}/recording-finalizer-proof/candidate/selection/**
          if-no-files-found: error

      - name: Upload build logs, exact launch configuration and native results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roma.recording-finalizer-native-evidence
          path: |
            ${{ runner.temp }}/recording-finalizer-proof/*.log
            ${{ runner.temp }}/recording-finalizer-proof/packages/*.log
            ${{ runner.temp }}/recording-finalizer-proof/baseline/*.log
            ${{ runner.temp }}/recording-finalizer-proof/baseline/*.xctestrun
            ${{ runner.temp }}/recording-finalizer-proof/baseline/*.csreq
            ${{ runner.temp }}/recording-finalizer-proof/baseline/Native.xcresult/**
            ${{ runner.temp }}/recording-finalizer-proof/candidate/*.log
            ${{ runner.temp }}/recording-finalizer-proof/candidate/*.xctestrun
            ${{ runner.temp }}/recording-finalizer-proof/candidate/*.csreq
            ${{ runner.temp }}/recording-finalizer-proof/candidate/Native.xcresult/**
            ${{ runner.temp }}/recording-finalizer-dependencies.log
          include-hidden-files: true
          if-no-files-found: error
