name: Verify literal dictation profile regression

on:
  workflow_dispatch:
  push:
    branches:
      - "ci/rjt-none-profile-check-*"

permissions:
  contents: read

concurrency:
  group: none-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode and static dependency toolchain
        run: |
          /usr/bin/caffeinate -d -i -u -t 5400 </dev/null >/dev/null 2>&1 &
          latest=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          test -n "$latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
          swift --version
          sw_vers
          command -v cmake >/dev/null || brew install cmake
          if ! xcrun metal --version >/dev/null 2>&1; then
            log="$RUNNER_TEMP/none-profile-metal-download.log"
            xcodebuild -downloadComponent MetalToolchain 2>&1 | tee "$log"
            if ! xcrun metal --version >/dev/null 2>&1; then
              dmg=$(sed -n 's/^Downloaded asset to: //p' "$log" | tail -n 1)
              test -n "$dmg"
              hdiutil attach -readonly -nobrowse "$dmg"
            fi
          fi
          xcrun metal --version

      - uses: actions/cache/restore@v4
        id: deps-cache
        with:
          path: |
            ~/VoiceInk-Dependencies/whisper.cpp
            ~/Library/Caches/org.swift.swiftpm
          key: writing-macos-${{ runner.arch }}-${{ hashFiles('Makefile', 'scripts/verify-static-whisper-xcframework.sh', 'VoiceInk.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Check the strict result classifier
        run: bash scripts/run-none-profile-regression.sh self-test

      - name: Bind unchanged oracle and exact package graph
        id: prepare
        run: bash scripts/run-none-profile-regression.sh prepare

      - name: Verify static Whisper dependencies
        id: dependencies
        run: |
          set -o pipefail
          make setup 2>&1 | tee "$RUNNER_TEMP/none-profile-dependencies.log"

      - uses: actions/cache/save@v4
        if: steps.deps-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/VoiceInk-Dependencies/whisper.cpp
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Require precise known-bad pipeline failures
        id: baseline
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.dependencies.outcome == 'success' }}
        run: bash scripts/run-none-profile-regression.sh baseline

      - name: Publish the baseline checkpoint
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: roma.none-profile-baseline
          path: |
            ${{ runner.temp }}/none-profile-proof/contract.json
            ${{ runner.temp }}/none-profile-proof/common-oracle.swift
            ${{ runner.temp }}/none-profile-proof/failure-*.json
            ${{ runner.temp }}/none-profile-proof/baseline/*.json
            ${{ runner.temp }}/none-profile-proof/baseline/*.txt
            ${{ runner.temp }}/none-profile-proof/baseline/tests.log
            ${{ runner.temp }}/none-profile-proof/baseline/selection/**
          if-no-files-found: error

      - name: Require exact candidate pipeline output
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.dependencies.outcome == 'success' }}
        run: bash scripts/run-none-profile-regression.sh candidate

      - name: Require the matched old-fail candidate-pass result
        id: matched
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.dependencies.outcome == 'success' }}
        run: bash scripts/run-none-profile-regression.sh verify

      - name: Publish the completed matched comparison
        id: matched-checkpoint
        if: ${{ !cancelled() && steps.matched.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: roma.none-profile-matched
          path: |
            ${{ runner.temp }}/none-profile-proof/*.json
            ${{ runner.temp }}/none-profile-proof/*.swift
            ${{ runner.temp }}/none-profile-proof/*/*.json
            ${{ runner.temp }}/none-profile-proof/*/*.txt
            ${{ runner.temp }}/none-profile-proof/*/tests.log
            ${{ runner.temp }}/none-profile-proof/*/selection/**
          if-no-files-found: error

      - name: Verify actual audio import through local Whisper
        if: ${{ !cancelled() && steps.matched.outcome == 'success' && steps.matched-checkpoint.outcome == 'success' }}
        run: bash scripts/run-none-profile-regression.sh import

      - name: Upload source contracts and result receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roma.none-profile-observations
          path: |
            ${{ runner.temp }}/none-profile-proof/*.json
            ${{ runner.temp }}/none-profile-proof/*.swift
            ${{ runner.temp }}/none-profile-proof/*/*.json
            ${{ runner.temp }}/none-profile-proof/*/*.txt
            ${{ runner.temp }}/none-profile-proof/*/tests.log
            ${{ runner.temp }}/none-profile-proof/*/selection/**
            ${{ runner.temp }}/none-profile-proof/import/observations/**
            ${{ runner.temp }}/none-profile-proof/import/input.wav
          if-no-files-found: error

      - name: Upload full comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roma.none-profile-evidence
          path: |
            ${{ runner.temp }}/none-profile-proof/**
            ${{ runner.temp }}/none-profile-dependencies.log
          include-hidden-files: true
          if-no-files-found: error
