name: Verify writing Undo menu and shortcut controls

on:
  workflow_dispatch:
  push:
    branches:
      - "ci/rjt-writing-undo-controls-*"

permissions:
  contents: read

concurrency:
  group: writing-undo-controls-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode and static dependency toolchain
        run: |
          /usr/bin/caffeinate -d -i -u -t 5400 </dev/null >/dev/null 2>&1 &
          latest=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          test -n "$latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
          swift --version
          sw_vers
          command -v cmake >/dev/null || brew install cmake
          if ! xcrun metal --version >/dev/null 2>&1; then
            log="$RUNNER_TEMP/writing-undo-controls-metal-download.log"
            xcodebuild -downloadComponent MetalToolchain 2>&1 | tee "$log"
            if ! xcrun metal --version >/dev/null 2>&1; then
              dmg=$(sed -n 's/^Downloaded asset to: //p' "$log" | tail -n 1)
              test -n "$dmg"
              hdiutil attach -readonly -nobrowse "$dmg"
            fi
          fi
          xcrun metal --version

      - uses: actions/cache/restore@v4
        id: deps-cache
        with:
          path: |
            ~/VoiceInk-Dependencies/whisper.cpp
            ~/Library/Caches/org.swift.swiftpm
          key: writing-macos-${{ runner.arch }}-${{ hashFiles('Makefile', 'scripts/verify-static-whisper-xcframework.sh', 'VoiceInk.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Check receipt rejection and signing classifiers
        run: |
          bash scripts/run-writing-undo-controls-check.sh self-test
          bash scripts/tests/verify-adhoc-macos-test-host.test.sh

      - name: Bind candidate, host fixture and canonical packages
        id: prepare
        run: bash scripts/run-writing-undo-controls-check.sh prepare

      - name: Prepare static Whisper for linkage without model weights
        id: dependencies
        run: |
          set -o pipefail
          make setup 2>&1 | tee "$RUNNER_TEMP/writing-undo-controls-dependencies.log"

      - uses: actions/cache/save@v4
        if: steps.deps-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/VoiceInk-Dependencies/whisper.cpp
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Build isolated component host and exercise genuine menu and shortcut
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.dependencies.outcome == 'success' }}
        run: bash scripts/run-writing-undo-controls-check.sh native

      - name: Verify exact editor, control, focus and closed-host evidence
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.dependencies.outcome == 'success' }}
        run: bash scripts/run-writing-undo-controls-check.sh verify

      - name: Upload control observations and source receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roma.writing-undo-controls-observations
          path: |
            ${{ runner.temp }}/writing-undo-controls-proof/*.json
            ${{ runner.temp }}/writing-undo-controls-proof/*.txt
            ${{ runner.temp }}/writing-undo-controls-proof/source/**
            ${{ runner.temp }}/writing-undo-controls-proof/signature/**
            ${{ runner.temp }}/writing-undo-controls-proof/packages/*.json
            ${{ runner.temp }}/writing-undo-controls-proof/packages/*.resolved
            ${{ runner.temp }}/writing-undo-controls-proof/native/**
          if-no-files-found: error

      - name: Upload build and native logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roma.writing-undo-controls-logs
          path: |
            ${{ runner.temp }}/writing-undo-controls-proof/*.log
            ${{ runner.temp }}/writing-undo-controls-proof/*.csreq
            ${{ runner.temp }}/writing-undo-controls-proof/packages/*.log
            ${{ runner.temp }}/writing-undo-controls-dependencies.log
            ${{ runner.temp }}/writing-undo-controls-metal-download.log
          include-hidden-files: true
          if-no-files-found: error
