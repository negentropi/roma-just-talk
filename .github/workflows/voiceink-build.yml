name: Build roma just talk

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/voiceink-build.yml"
      - "LocalBuild.xcconfig"
      - "Makefile"
      - "VoiceInk/**"
      - "VoiceInk.xcodeproj/**"

jobs:
  build:
    name: Build local macOS app
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Build local app
        run: make local

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project VoiceInk.xcodeproj \
            -scheme VoiceInk \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$PWD/.local-build" \
            -xcconfig LocalBuild.xcconfig \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_ENTITLEMENTS="$PWD/VoiceInk/VoiceInk.local.entitlements" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) LOCAL_BUILD' \
            -only-testing:VoiceInkTests

      - name: Package app
        run: ditto -c -k --keepParent "$HOME/Applications/roma just talk.app" "roma just talk.app.zip"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: roma just talk app
          path: roma just talk.app.zip
          if-no-files-found: error
