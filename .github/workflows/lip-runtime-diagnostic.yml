name: Diagnose actual lip dictation runtime

on:
  push:
    branches:
      - "ci/lip-runtime-diagnostic-*"

permissions:
  contents: read
  actions: read

jobs:
  runtime-diagnostic:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      LIP_CAMERA_PROBE_USE_HOST_AUTOLOGIN_AUTH: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Select native toolchain
        run: |
          latest=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$latest"
          /usr/bin/caffeinate -d -i -u -t 2100 </dev/null >/dev/null 2>&1 &
          xcodebuild -version
          sw_vers

      - name: Retrieve exact earlier Release artifact for diagnosis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/lip-runtime-source" "$HOME/Applications"
          gh api repos/negentropi/roma-just-talk/actions/artifacts/12969342874 > "$RUNNER_TEMP/lip-runtime-source/artifact.json"
          python3 - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'lip-runtime-source/artifact.json'
          a=json.loads(p.read_text())
          assert not a['expired']
          assert a['workflow_run']['head_sha']=='6a3e4cbbef3e39bdf4ef6bf20fadb58824114ca1'
          assert a['name']=='roma.just.talk.app'
          PY
          gh api repos/negentropi/roma-just-talk/actions/artifacts/12969342874/zip > "$RUNNER_TEMP/lip-runtime-source/artifact.zip"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'lip-runtime-source'
          a=json.loads((p/'artifact.json').read_text())
          assert a['digest']=='sha256:'+hashlib.file_digest((p/'artifact.zip').open('rb'),'sha256').hexdigest()
          PY
          unzip -q "$RUNNER_TEMP/lip-runtime-source/artifact.zip" -d "$RUNNER_TEMP/lip-runtime-source/unpacked"
          ditto -x -k "$RUNNER_TEMP/lip-runtime-source/unpacked/roma.just.talk.app.zip" "$HOME/Applications"

      - name: Execute the actual runtime core checks
        run: |
          set -euo pipefail
          swift run --package-path Tools/RuntimeE2EHarness --scratch-path "$RUNNER_TEMP/runtime-core" RuntimeE2ECoreChecks 2>&1 | tee "$RUNNER_TEMP/runtime-core-checks.log"
          python3 - <<'PY'
          import os, pathlib
          text=(pathlib.Path(os.environ['RUNNER_TEMP'])/'runtime-core-checks.log').read_text()
          assert 'PASS confirmed empty baselines survive cold AX without accepting unreadable-frame or stale-text timestamps' in text
          PY

      - name: Declare diagnostic overlay for the verified older app
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          assert os.environ['GITHUB_REF'].startswith('refs/heads/ci/lip-runtime-diagnostic-')
          p=pathlib.Path('Tools/LipDictationE2E/run.py')
          original=p.read_text()
          assert original==subprocess.check_output(['git','show','HEAD:'+str(p)],text=True)
          guard="    if not args.build_helper_only and head != args.app_source_head:\n        raise RuntimeError('The supplied app build head must match the checked-out proof source')\n"
          boundary='The declared app source head is compared with the checkout. The calling workflow must establish the app was built from that head. The executable hash and signature are verified here.'
          assert original.count(guard)==1 and original.count(boundary)==1
          diagnostic=original.replace(guard,'',1).replace(boundary,'DIAGNOSTIC ONLY. The older declared app is verified by artifact metadata and digest; this checkout supplies newer proof tools. This is not final-head acceptance.',1)
          camera_guard="if camera.get('sourceHead') != args.app_source_head:"
          assert diagnostic.count(camera_guard)==1
          diagnostic=diagnostic.replace(camera_guard,"if camera.get('sourceHead') != os.environ['GITHUB_SHA']:",1)
          diagnostic=diagnostic.replace("summary = {'sourceHead': head,", "summary = {'diagnosticOnly': True, 'sourceHead': head,",1)
          launch_anchor="        deny_microphone = scenario == 'lips'\n"
          assert diagnostic.count(launch_anchor)==1
          launch_environment="""        command[3:3] = [
                      '--env', 'GITHUB_ACTIONS=' + os.environ['GITHUB_ACTIONS'],
                      '--env', 'RUNNER_ENVIRONMENT=' + os.environ['RUNNER_ENVIRONMENT'],
                      '--env', 'GITHUB_REF=' + os.environ['GITHUB_REF'],
                      '--env', 'GITHUB_SHA=' + os.environ['GITHUB_SHA'],
                      '--env', 'LIP_PUBLIC_CAPTURE_DIAGNOSTIC=1',
                      '--env', 'LIP_PUBLIC_CAPTURE_CONTEXT=' + str(Path(os.environ['RUNNER_TEMP']) / 'lip-runtime-source/public-capture-context.json'),
                  ]
          """
          diagnostic=diagnostic.replace(launch_anchor,launch_environment+launch_anchor,1)
          voice_start="        report_path = evidence / 'voice-default-off.json'\n"
          visual_start="        if args.visual:\n            summary['visualCases'] = "
          assert diagnostic.count(voice_start)==1 and diagnostic.count(visual_start)==1
          start=diagnostic.index(voice_start)
          end=diagnostic.index(visual_start,start)
          skipped=diagnostic[start:end]
          reason='Not assessed in camera-only older-app diagnostic; final app workflow retains both strict voice cases'
          diagnostic=diagnostic[:start]+"        summary['voiceDefaultOff'] = "+repr({'assessed':False,'passed':False,'reason':reason})+"\n"+diagnostic[end:]
          assert diagnostic.count("'lipDictationVerified'")==2
          diagnostic=diagnostic.replace("'lipDictationVerified'","'visualDiagnosticCompletedOlderApp'")
          compile(diagnostic,str(p),'exec')
          p.write_text(diagnostic)
          receipt={'diagnosticOnly':True,'appBuildHead':'6a3e4cbbef3e39bdf4ef6bf20fadb58824114ca1','proofGitHead':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'originalRunnerSHA256':hashlib.sha256(original.encode()).hexdigest(),'diagnosticRunnerSHA256':hashlib.sha256(diagnostic.encode()).hexdigest(),'change':'Camera-only older-app diagnosis; final product proof keeps strict head equality and both voice cases.','completionStatus':'visualDiagnosticCompletedOlderApp','skippedBoundary':{'start':voice_start.strip(),'endExclusive':'if args.visual:','sourceSHA256':hashlib.sha256(skipped.encode()).hexdigest(),'reason':reason}}
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'lip-runtime-source/proof-overlay.json').write_text(json.dumps(receipt,indent=2))
          context={'diagnosticOnly':True,'appBuildHead':receipt['appBuildHead'],'proofGitHead':receipt['proofGitHead'],'publicSourceSHA256':'db7b8cf8cdbe547ab491c42801a1bae5b16c5471050d7e3d9e1f0173c7a0d8fc','evidenceDirectory':str(pathlib.Path(os.environ['RUNNER_TEMP'])/'lip-dictation-e2e'),'boundary':'Fresh disposable GitHub host; controlled public OBS fixture only. Copy only the sole new owned MOV after matching writer close and before observed recording drain. Product cleanup remains unchanged.'}
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'lip-runtime-source/public-capture-context.json').write_text(json.dumps(context,indent=2))
          PY

      - name: Exercise actual app and record focus boundaries
        run: python3 Tools/LipDictationE2E/run.py --app "$HOME/Applications/roma just talk.app" --app-source-head 6a3e4cbbef3e39bdf4ef6bf20fadb58824114ca1 --visual

      - name: Diagnose retained public captures with the exact older native package
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Tools/LipDictationE2E/analyze_public_capture.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lip-runtime-diagnostic-evidence
          path: |
            ${{ runner.temp }}/lip-dictation-e2e/**
            ${{ runner.temp }}/lip-runtime-source/artifact.json
            ${{ runner.temp }}/lip-runtime-source/proof-overlay.json
            ${{ runner.temp }}/lip-runtime-source/public-capture-context.json
            ${{ runner.temp }}/runtime-core-checks.log
            ${{ runner.temp }}/lip-camera-probe/*.json
            ${{ runner.temp }}/lip-camera-probe/*.log
            ${{ runner.temp }}/lip-camera-probe/*.png
          if-no-files-found: error
