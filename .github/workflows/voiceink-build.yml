name: Diagnose VoiceInk modifier monitor test

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Diagnose modifier monitor test
    runs-on: namespace-profile-roma-jt
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Prepare local Whisper framework
        run: make setup

      - name: Run isolated test and print xcresult
        shell: bash
        run: |
          set +e
          RESULT_BUNDLE="$PWD/.local-build/ModifierMonitorTest.xcresult"
          xcodebuild test \
            -project VoiceInk.xcodeproj \
            -scheme VoiceInk \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$PWD/.local-build" \
            -resultBundlePath "$RESULT_BUNDLE" \
            -xcconfig LocalBuild.xcconfig \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_ENTITLEMENTS="$PWD/VoiceInk/VoiceInk.local.entitlements" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) LOCAL_BUILD' \
            -only-testing:VoiceInkTests/VoiceInkTests/modifierOnlyShortcutsUseNSEventMonitorPath
          TEST_EXIT=$?
          set -e

          if ! xcrun xcresulttool get test-results tests \
            --path "$RESULT_BUNDLE" \
            --format json; then
            echo "xcresulttool could not decode test results"
          fi

          exit "$TEST_EXIT"
