name: Verify native writing Undo

on:
  workflow_dispatch:
  push:
    branches:
      - "ci/rjt-writing-undo-native-*"

permissions:
  contents: read

concurrency:
  group: writing-undo-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode and the static dependency toolchain
        run: |
          /usr/bin/caffeinate -d -i -u -t 5400 </dev/null >/dev/null 2>&1 &
          latest=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          test -n "$latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
          swift --version
          sw_vers
          command -v cmake >/dev/null || brew install cmake
          if ! xcrun metal --version >/dev/null 2>&1; then
            log="$RUNNER_TEMP/writing-undo-native-metal-download.log"
            xcodebuild -downloadComponent MetalToolchain 2>&1 | tee "$log"
            if ! xcrun metal --version >/dev/null 2>&1; then
              dmg=$(sed -n 's/^Downloaded asset to: //p' "$log" | tail -n 1)
              test -n "$dmg"
              hdiutil attach -readonly -nobrowse "$dmg"
            fi
          fi
          xcrun metal --version

      - uses: actions/cache/restore@v4
        id: deps-cache
        with:
          path: |
            ~/VoiceInk-Dependencies/whisper.cpp
            ~/Library/Caches/org.swift.swiftpm
          key: writing-macos-${{ runner.arch }}-${{ hashFiles('Makefile', 'scripts/verify-static-whisper-xcframework.sh', 'VoiceInk.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Check exact native selection, receipt and signing classifiers
        run: |
          bash scripts/run-writing-undo-native-check.sh self-test
          bash scripts/tests/verify-adhoc-macos-test-host.test.sh

      - name: Bind candidate source, native oracles and 41 canonical packages
        id: prepare
        run: bash scripts/run-writing-undo-native-check.sh prepare

      - name: Prepare and verify static Whisper for app linkage
        id: dependencies
        run: |
          set -o pipefail
          make setup 2>&1 | tee "$RUNNER_TEMP/writing-undo-native-dependencies.log"

      - uses: actions/cache/save@v4
        if: steps.deps-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/VoiceInk-Dependencies/whisper.cpp
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Build once, isolate process termination, then execute remaining five cases
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.dependencies.outcome == 'success' }}
        run: bash scripts/run-writing-undo-native-check.sh native

      - name: Recheck six receipts, closed execution and discovery hosts, frozen signed app
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.dependencies.outcome == 'success' }}
        run: bash scripts/run-writing-undo-native-check.sh verify

      - name: Upload compact native Undo observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roma.writing-undo-native-observations
          path: |
            ${{ runner.temp }}/writing-undo-native-proof/*.json
            ${{ runner.temp }}/writing-undo-native-proof/*.txt
            ${{ runner.temp }}/writing-undo-native-proof/source/**
            ${{ runner.temp }}/writing-undo-native-proof/test-host-signature/**
            ${{ runner.temp }}/writing-undo-native-proof/packages/*.json
            ${{ runner.temp }}/writing-undo-native-proof/packages/*.resolved
            ${{ runner.temp }}/writing-undo-native-proof/process/*.json
            ${{ runner.temp }}/writing-undo-native-proof/process/*.txt
            ${{ runner.temp }}/writing-undo-native-proof/process/tests.log
            ${{ runner.temp }}/writing-undo-native-proof/process/observations/**
            ${{ runner.temp }}/writing-undo-native-proof/process/editor-observations/**
            ${{ runner.temp }}/writing-undo-native-proof/process/discovery/**
            ${{ runner.temp }}/writing-undo-native-proof/process/selection/**
            ${{ runner.temp }}/writing-undo-native-proof/remaining/*.json
            ${{ runner.temp }}/writing-undo-native-proof/remaining/*.txt
            ${{ runner.temp }}/writing-undo-native-proof/remaining/tests.log
            ${{ runner.temp }}/writing-undo-native-proof/remaining/observations/**
            ${{ runner.temp }}/writing-undo-native-proof/remaining/editor-observations/**
            ${{ runner.temp }}/writing-undo-native-proof/remaining/discovery/**
            ${{ runner.temp }}/writing-undo-native-proof/remaining/selection/**
          if-no-files-found: error

      - name: Upload build logs, both native results and exact launch configurations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roma.writing-undo-native-evidence
          path: |
            ${{ runner.temp }}/writing-undo-native-proof/*.log
            ${{ runner.temp }}/writing-undo-native-proof/packages/*.log
            ${{ runner.temp }}/writing-undo-native-proof/process/*.xctestrun
            ${{ runner.temp }}/writing-undo-native-proof/process/*.csreq
            ${{ runner.temp }}/writing-undo-native-proof/process/Native.xcresult/**
            ${{ runner.temp }}/writing-undo-native-proof/remaining/*.xctestrun
            ${{ runner.temp }}/writing-undo-native-proof/remaining/*.csreq
            ${{ runner.temp }}/writing-undo-native-proof/remaining/Native.xcresult/**
            ${{ runner.temp }}/writing-undo-native-dependencies.log
            ${{ runner.temp }}/writing-undo-native-metal-download.log
          include-hidden-files: true
          if-no-files-found: error
