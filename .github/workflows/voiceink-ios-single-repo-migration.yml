name: VoiceInk iOS single-repo migration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/voiceink-ios-single-repo-migration.yml"
      - "scripts/**"
      - "docs/**"
      - "VoiceInkCore/**"
      - "iOS/**"
      - "VoiceInk/**"
      - "VoiceInk.xcodeproj/**"
      - "VoiceInk.xcworkspace/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/voiceink-ios-single-repo-migration.yml"
      - "scripts/**"
      - "docs/**"
      - "VoiceInkCore/**"
      - "iOS/**"
      - "VoiceInk/**"
      - "VoiceInk.xcodeproj/**"
      - "VoiceInk.xcworkspace/**"

permissions:
  contents: read

jobs:
  verify:
    name: Verify single-repo migration
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Run config verifier
        run: bash scripts/verify-ios-single-repo-migration.sh

      - name: Run VoiceInkCore checks
        run: swift run --package-path VoiceInkCore VoiceInkCoreChecks

      - name: Prepare local Whisper framework
        run: make setup

      - name: Build macOS app
        run: make local CONFIGURATION=Release

      - name: Build iOS app
        run: |
          xcodebuild build \
            -workspace VoiceInk.xcworkspace \
            -scheme VoiceInk-ios \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$PWD/.local-build-ios" \
            CODE_SIGNING_ALLOWED=NO
