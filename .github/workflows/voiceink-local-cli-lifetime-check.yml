name: Compare Local CLI request lifetime

on:
  workflow_dispatch:
  push:
    branches:
      - "ci/rjt-local-cli-lifetime-check-*"

permissions:
  contents: read

concurrency:
  group: local-cli-lifetime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lifetime:
    runs-on: macos-26
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Verify the result classifier
        run: |
          git fetch --no-tags --depth=1 origin 919670ae5b918afbfad6f4d88982a481c1c4b532
          bash scripts/run-local-cli-lifetime-check.sh --self-test

      - name: Select installed Xcode 26
        run: |
          set -o pipefail
          latest=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          test -n "$latest"
          sudo xcode-select -s "$latest"
          {
            git rev-parse HEAD
            xcodebuild -version
            swift --version
            sw_vers
          } 2>&1 | tee "$RUNNER_TEMP/local-cli-lifetime-toolchain.log"

      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: core-macos26-${{ runner.arch }}-${{ hashFiles('VoiceInkCore/Package.swift', 'VoiceInkCore/Package.resolved', 'VoiceInkNVIDIA/Package.swift', 'VoiceInkNVIDIA/Package.resolved') }}

      - name: Compare the same request boundary on old and new service sources
        run: |
          set -o pipefail
          git fetch --no-tags --depth=1 origin aaaa286a794ac6f60773ef5149a30f214c586f23
          bash scripts/run-local-cli-lifetime-check.sh \
            2>&1 | tee "$RUNNER_TEMP/local-cli-lifetime-driver.log"

      - name: Upload source, identity and lifetime receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roma.local-cli-lifetime-evidence
          path: |
            ${{ runner.temp }}/local-cli-lifetime-toolchain.log
            ${{ runner.temp }}/local-cli-lifetime-driver.log
            ${{ runner.temp }}/local-cli-lifetime-check/*.json
            ${{ runner.temp }}/local-cli-lifetime-check/*.txt
            ${{ runner.temp }}/local-cli-lifetime-check/*.log
            ${{ runner.temp }}/local-cli-lifetime-check/*/*.json
            ${{ runner.temp }}/local-cli-lifetime-check/*/*.txt
            ${{ runner.temp }}/local-cli-lifetime-check/*/*.log
            ${{ runner.temp }}/local-cli-lifetime-check/baseline/**
            ${{ runner.temp }}/local-cli-lifetime-check/candidate/**
            ${{ runner.temp }}/local-cli-lifetime-check/raw/**
            ${{ runner.temp }}/local-cli-lifetime-check/package/Package.swift
            ${{ runner.temp }}/local-cli-lifetime-check/package/Package.resolved
            ${{ runner.temp }}/local-cli-lifetime-check/package/Sources/**
          if-no-files-found: error
