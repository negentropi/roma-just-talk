name: End-to-end UI proof

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "ci/**"
    paths:
      - ".github/workflows/voiceink-e2e.yml"
      - "LocalBuild.xcconfig"
      - "Makefile"
      - "VoiceInk/**"
      - "VoiceInkCore/**"
      - "VoiceInkUITests/**"
      - "VoiceInk.xcodeproj/**"
      - "VoiceInk.xcworkspace/**"
      - "iOS/**"

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  macos-ui:
    name: macOS UI smoke
    runs-on: namespace-profile-roma-jt
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Prepare local Whisper framework
        run: make setup

      - name: Run macOS UI tests
        run: |
          mkdir -p "$PWD/.e2e-results"
          xcodebuild test \
            -project VoiceInk.xcodeproj \
            -scheme VoiceInk \
            -configuration Debug \
            -destination "platform=macOS" \
            -derivedDataPath "$PWD/.e2e-macos" \
            -resultBundlePath "$PWD/.e2e-results/macos.xcresult" \
            -parallel-testing-enabled NO \
            -xcconfig LocalBuild.xcconfig \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_ENTITLEMENTS="$PWD/VoiceInk/VoiceInk.local.entitlements" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) LOCAL_BUILD' \
            -only-testing:VoiceInkUITests/VoiceInkUITests

      - name: Upload macOS UI proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-ui-proof
          path: .e2e-results/macos.xcresult
          if-no-files-found: warn
          retention-days: 7

  ios-ui:
    name: iOS Simulator UI smoke
    runs-on: namespace-profile-roma-jt
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Prepare local Whisper framework
        run: make setup

      - name: Boot iOS Simulator
        run: |
          SIMULATOR_UDID="$(
            xcrun simctl list devices available --json \
              | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid'
          )"
          test -n "$SIMULATOR_UDID"
          test "$SIMULATOR_UDID" != "null"
          xcrun simctl shutdown "$SIMULATOR_UDID" || true
          xcrun simctl erase "$SIMULATOR_UDID"
          xcrun simctl boot "$SIMULATOR_UDID"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"

      - name: Run iOS UI tests
        run: |
          mkdir -p "$PWD/.e2e-results"
          xcodebuild test \
            -workspace VoiceInk.xcworkspace \
            -scheme VoiceInk-ios \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$PWD/.e2e-ios" \
            -resultBundlePath "$PWD/.e2e-results/ios.xcresult" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:VoiceInk-iosUITests/VoiceInkIOSUITests

      - name: Upload iOS UI proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-proof
          path: .e2e-results/ios.xcresult
          if-no-files-found: warn
          retention-days: 7
